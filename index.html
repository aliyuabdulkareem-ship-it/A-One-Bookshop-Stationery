<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A-One Bookshop & Stationery — Ibadan's trusted bookstore" />
    <title>A-One Bookshop & Stationery | Books & Stationery in Ibadan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- React Router (Fixed CDN) -->
    <script crossorigin src="https://unpkg.com/react-router-dom@6.20.0/umd/react-router-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * { scrollbar-width: thin; scrollbar-color: #d4a574 transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;
        const { BrowserRouter, Routes, Route, Link, Navigate } = ReactRouterDOM;

        // Simple demo data
        const products = [
            { id: '1', name: 'The Art of Programming', author: 'Donald Knuth', price: 45.99, category: 'physical-books', image: '📘', stock: 25 },
            { id: '2', name: 'Modern Web Development', author: 'Sarah Chen', price: 38.50, category: 'ebooks', image: '📱', stock: 999 },
            { id: '3', name: 'Premium Notebook Set', author: 'A1 Stationery', price: 18.99, category: 'stationery', image: '📓', stock: 50 },
        ];

        function Navbar() {
            return (
                <nav className="bg-white/80 backdrop-blur-md border-b border-amber-100 sticky top-0 z-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-16">
                            <Link to="/" className="flex items-center gap-2.5">
                                <div className="w-9 h-9 bg-gradient-to-br from-amber-500 to-amber-700 rounded-lg flex items-center justify-center">
                                    <span className="text-white text-lg">📚</span>
                                </div>
                                <span className="text-lg font-bold text-gray-900">A-One <span className="text-amber-600">Bookshop</span></span>
                            </Link>
                            <div className="flex items-center gap-4">
                                <Link to="/shop" className="px-4 py-2 rounded-full text-sm font-medium text-gray-600 hover:bg-gray-50">Shop</Link>
                                <Link to="/login" className="px-4 py-2 rounded-full bg-amber-600 text-white text-sm font-medium hover:bg-amber-700">Sign In</Link>
                            </div>
                        </div>
                    </div>
                </nav>
            );
        }

        function Home() {
            return (
                <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24">
                        <h1 className="text-5xl md:text-6xl font-bold text-gray-900 mb-6">
                            Your Trusted <span className="text-amber-600">Bookshop</span>
                        </h1>
                        <p className="text-xl text-gray-600 mb-8 max-w-2xl">
                            Welcome to <strong>A-One Bookshop & Stationery</strong> — Ibadan's destination for books, e-books, and premium stationery.
                        </p>
                        <div className="flex gap-4">
                            <Link to="/shop" className="inline-flex items-center gap-2 bg-amber-600 text-white px-7 py-3.5 rounded-full font-medium hover:bg-amber-700">
                                Browse Collection →
                            </Link>
                            <a href="https://wa.me/2348140730041" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-green-600 text-white px-7 py-3.5 rounded-full font-medium hover:bg-green-700">
                                Chat on WhatsApp
                            </a>
                        </div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                        <h2 className="text-3xl font-bold text-gray-900 mb-8">Featured Products</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {products.map(product => (
                                <div key={product.id} className="bg-white rounded-2xl p-6 border border-gray-100 hover:shadow-lg">
                                    <div className="text-6xl mb-4">{product.image}</div>
                                    <h3 className="font-semibold text-gray-900 text-lg mb-1">{product.name}</h3>
                                    <p className="text-sm text-gray-500 mb-2">by {product.author}</p>
                                    <div className="flex items-center justify-between">
                                        <span className="text-lg font-bold text-amber-600">${product.price.toFixed(2)}</span>
                                        <button className="px-4 py-2 bg-amber-600 text-white rounded-full text-sm font-medium hover:bg-amber-700">
                                            Add to Cart
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function Shop() {
            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                        <h1 className="text-3xl font-bold text-gray-900 mb-8">Our Collection</h1>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {products.map(product => (
                                <div key={product.id} className="bg-white rounded-2xl p-6 border border-gray-100">
                                    <div className="text-6xl mb-4">{product.image}</div>
                                    <h3 className="font-semibold text-gray-900">{product.name}</h3>
                                    <p className="text-sm text-gray-500">{product.author}</p>
                                    <p className="text-lg font-bold text-amber-600 mt-2">${product.price.toFixed(2)}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function Login() {
            return (
                <div className="min-h-screen bg-gradient-to-br from-amber-50 to-orange-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full">
                        <h2 className="text-2xl font-bold text-gray-900 mb-6 text-center">Welcome Back</h2>
                        <div className="space-y-4">
                            <input type="email" placeholder="Email" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" />
                            <input type="password" placeholder="Password" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" />
                            <button className="w-full bg-amber-600 text-white py-3 rounded-xl font-medium hover:bg-amber-700">Sign In</button>
                        </div>
                        <p className="text-center text-sm text-gray-500 mt-6">
                            Demo: admin@a1bookshop.com / admin123
                        </p>
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <BrowserRouter>
                    <div className="min-h-screen bg-gray-50">
                        <Navbar />
                        <Routes>
                            <Route path="/" element={<Home />} />
                            <Route path="/shop" element={<Shop />} />
                            <Route path="/login" element={<Login />} />
                        </Routes>
                    </div>
                </BrowserRouter>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
