        function Shop({ addToCart, products }) {
            const [search, setSearch] = useState('');
            const [activeCategory, setActiveCategory] = useState('all');
            const filtered = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.author.toLowerCase().includes(search.toLowerCase());

                return matchesSearch && matchesCategory;
            });

                <div className="min-h-screen bg-gray-50/50">

                                        <p className="text-sm text-gray-500 mb-4">by {product.author}</p>

        function Cart({ cart, removeFromCart, updateQuantity, onCheckout }) {
            const [name, setName] = useState('');
            const [address, setAddress] = useState('');
            const [phone, setPhone] = useState('');
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const handleSubmit = (e) => {
                e.preventDefault();
                if (!name || !address || !phone) return alert('Please fill in all details');
                onCheckout({ name, address, phone }, cart, total);
            };
            if (cart.length === 0) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">

                            <div className="text-6xl mb-4">🛒</div>

                        </div>
                    </div>
                );
            }
            return (
                <div className="min-h-screen bg-gray-50/50 py-12">

                                                <div><p className="font-medium text-gray-900">{item.name}</p><p className="text-sm text-gray-500">₦{item.price.toLocaleString()}</p></div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => updateQuantity(item.id, -1)} className="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 font-bold">-</button>
                                                <span className="w-6 text-center font-medium">{item.quantity}</span>
                                                <button onClick={() => updateQuantity(item.id, 1)} className="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 font-bold">+</button>
                                                <button onClick={() => removeFromCart(item.id)} className="ml-2 text-red-500 hover:text-red-700 text-sm font-medium">Remove</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-6 pt-4 border-t border-gray-200 flex justify-between items-center">
                                    <span className="text-lg font-bold text-gray-900">Total:</span>
                                    <span className="text-2xl font-bold text-amber-600">₦{total.toLocaleString()}</span>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl border border-gray-100 p-6 h-fit">
                                <h2 className="text-xl font-bold text-gray-900 mb-4">Delivery Details</h2>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label><input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" placeholder="John Doe" required /></div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Delivery Address</label><input type="text" value={address} onChange={e => setAddress(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" placeholder="123 Main St, Ibadan" required /></div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Phone Number</label><input type="tel" value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" placeholder="08012345678" required /></div>

                                        <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M20.52 3.449C12.831-3.984.106 1.407.101 11.893c0 2.096.549 4.14 1.595 5.945L0 24l6.335-1.652c7.926 4.156 17.389-1.59 17.394-10.447 0-3.176-1.24-6.165-3.483-8.402l.274-.052zM12.056 21.785c-1.675-.001-3.314-.452-4.745-1.305l-.34-.202-3.514.918.952-3.427-.222-.352c-2.066-3.284-1.526-7.58.899-10.351 2.425-2.771 6.512-3.612 9.898-2.026 3.386 1.586 5.448 5.074 4.97 8.721-.478 3.648-3.546 6.524-7.234 6.624h-.664z"/></svg>

                                    </button>
                                </form>

        function LoginGate({ title, password, onLogin, setPage, themeColor }) {
            const [input, setInput] = useState('');
            const [error, setError] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (input === password) onLogin();
                else { setError('Incorrect password. Access denied.'); setInput(''); }
            };
            return (
                <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                        <div className="text-center mb-6">
                            <div className={`w-16 h-16 ${themeColor === 'amber' ? 'bg-amber-100' : 'bg-indigo-100'} rounded-full flex items-center justify-center mx-auto mb-4`}>
                                <svg className={`w-8 h-8 ${themeColor === 'amber' ? 'text-amber-600' : 'text-indigo-600'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                            </div>
                            <h2 className="text-2xl font-bold text-gray-900">{title}</h2>
                            <p className="text-sm text-gray-500 mt-2">Please enter your password to continue</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input type="password" value={input} onChange={e => { setInput(e.target.value); setError(''); }} className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none text-center text-lg tracking-widest" placeholder="••••••••" autoFocus required />
                            {error && <div className="bg-red-50 text-red-600 text-sm p-3 rounded-xl text-center">{error}</div>}
                            <button type="submit" className={`w-full ${themeColor === 'amber' ? 'bg-amber-600 hover:bg-amber-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white py-3 rounded-xl font-bold transition-colors`}>Unlock Dashboard</button>
                            <button type="button" onClick={() => setPage('home')} className="w-full text-gray-500 text-sm hover:text-gray-700 py-2">← Back to Website</button>
                        </form>
                    </div>

            );
        }

            const [tab, setTab] = useState('products');
            const [showAddForm, setShowAddForm] = useState(false);
            const [newProduct, setNewProduct] = useState({ name: '', author: '', price: '', category: 'physical-books', image: '' });

                e.preventDefault();
                const product = { id: Date.now().toString(), name: newProduct.name, author: newProduct.author, price: Number(newProduct.price), category: newProduct.category, image: newProduct.image, publisherId: 'admin' };
                setProducts([...products, product]);
                setNewProduct({ name: '', author: '', price: '', category: 'physical-books', image: '' });
                setShowAddForm(false);
            };
            const handleDeleteProduct = (id) => { if (window.confirm('Delete this product?')) setProducts(products.filter(p => p.id !== id)); };
            const handleClearOrders = () => { if (window.confirm('Clear all order history?')) setOrders([]); };

            return (
                <div className="min-h-screen bg-gray-50 py-12">
                    <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-900">Admin Dashboard</h1>
                            <button onClick={() => setPage('home')} className="text-amber-600 hover:underline font-medium">← Back to Site</button>
                        </div>
                        <div className="flex gap-4 mb-6 border-b border-gray-200">
                            <button onClick={() => setTab('products')} className={`pb-2 px-4 font-medium ${tab === 'products' ? 'border-b-2 border-amber-600 text-amber-600' : 'text-gray-500'}`}>Manage Products</button>
                            <button onClick={() => setTab('orders')} className={`pb-2 px-4 font-medium ${tab === 'orders' ? 'border-b-2 border-amber-600 text-amber-600' : 'text-gray-500'}`}>View Orders ({orders.length})</button>
                        </div>
                        {tab === 'products' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold">Product Inventory</h2>
                                    <button onClick={() => setShowAddForm(!showAddForm)} className="bg-amber-600 text-white px-4 py-2 rounded-lg hover:bg-amber-700 text-sm font-medium">+ Add New Product</button>
                                </div>
                                {showAddForm && (
                                    <form onSubmit={handleAddProduct} className="bg-white p-6 rounded-xl border border-gray-200 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4 shadow-sm">
                                        <input required placeholder="Product Name" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-amber-500" />
                                        <input required placeholder="Author / Brand" value={newProduct.author} onChange={e => setNewProduct({...newProduct, author: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-amber-500" />
                                        <input required type="number" placeholder="Price (e.g., 15000)" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-amber-500" />
                                        <select value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-amber-500 bg-white">
                                            {categories.filter(c => c !== 'all').map(cat => <option key={cat} value={cat}>{categoryLabels[cat]}</option>)}
                                        </select>
                                        <input required placeholder="Emoji Icon (e.g., 📘)" value={newProduct.image} onChange={e => setNewProduct({...newProduct, image: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-amber-500 md:col-span-2" />
                                        <div className="flex gap-3 md:col-span-2">
                                            <button type="button" onClick={() => setShowAddForm(false)} className="flex-1 border border-gray-300 text-gray-700 p-3 rounded-lg hover:bg-gray-50">Cancel</button>
                                            <button type="submit" className="flex-1 bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 font-medium">Save Product</button>
                                        </div>
                                    </form>
                                )}
                                <div className="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                                    <table className="w-full text-left">
                                        <thead className="bg-gray-50"><tr><th className="p-4 text-sm font-semibold text-gray-600">Icon</th><th className="p-4 text-sm font-semibold text-gray-600">Name</th><th className="p-4 text-sm font-semibold text-gray-600">Category</th><th className="p-4 text-sm font-semibold text-gray-600">Price</th><th className="p-4 text-sm font-semibold text-gray-600">Action</th></tr></thead>
                                        <tbody>
                                            {products.map(p => (
                                                <tr key={p.id} className="border-t hover:bg-gray-50">
                                                    <td className="p-4 text-2xl">{p.image}</td>
                                                    <td className="p-4"><div className="font-medium text-gray-900">{p.name}</div><div className="text-sm text-gray-500">{p.author}</div></td>
                                                    <td className="p-4 capitalize text-sm text-gray-600">{p.category.replace('-', ' ')}</td>
                                                    <td className="p-4 font-medium text-gray-900">₦{p.price.toLocaleString()}</td>
                                                    <td className="p-4"><button onClick={() => handleDeleteProduct(p.id)} className="text-red-600 hover:text-red-800 text-sm font-medium bg-red-50 px-3 py-1.5 rounded-lg hover:bg-red-100 transition-colors">Delete</button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                        {tab === 'orders' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold">Recent Orders</h2>
                                    {orders.length > 0 && <button onClick={handleClearOrders} className="text-red-600 text-sm hover:underline font-medium">Clear All History</button>}
                                </div>
                                {orders.length === 0 ? (
                                    <div className="bg-white p-12 rounded-xl border border-gray-200 text-center text-gray-500 shadow-sm"><div className="text-4xl mb-3">📦</div><p>No orders yet.</p></div>
                                ) : (
                                    <div className="space-y-4">
                                        {orders.map(order => (
                                            <div key={order.id} className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                                                    <div><h3 className="font-bold text-lg text-gray-900">{order.customer.name}</h3><p className="text-sm text-gray-500">{order.date}</p></div>
                                                    <span className="bg-amber-100 text-amber-800 px-4 py-1.5 rounded-full text-sm font-bold">₦{order.total.toLocaleString()}</span>
                                                </div>
                                                <div className="text-sm text-gray-600 mb-4 bg-gray-50 p-3 rounded-lg"><p className="mb-1">📍 {order.customer.address}</p><p>📞 {order.customer.phone}</p></div>
                                                <div className="border-t pt-3 space-y-1">
                                                    {order.items.map((item, idx) => (
                                                        <div key={idx} className="flex justify-between text-sm"><span className="text-gray-700">{item.quantity}x {item.name}</span><span className="font-medium text-gray-900">₦{(item.price * item.quantity).toLocaleString()}</span></div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function Publisher({ products, setProducts, orders, setPage }) {
            const [tab, setTab] = useState('products');
            const [showAddForm, setShowAddForm] = useState(false);
            const [newProduct, setNewProduct] = useState({ name: '', author: '', price: '', category: 'physical-books', image: '📘' });

            const myProducts = products.filter(p => p.publisherId === PUBLISHER_ID);
            const myProductIds = myProducts.map(p => p.id);
            const myOrders = orders.filter(o => o.items.some(i => myProductIds.includes(i.id)));

            const handleAddProduct = (e) => {
                e.preventDefault();
                const product = { id: Date.now().toString(), name: newProduct.name, author: newProduct.author, price: Number(newProduct.price), category: newProduct.category, image: newProduct.image, publisherId: PUBLISHER_ID };
                setProducts([...products, product]);
                setNewProduct({ name: '', author: '', price: '', category: 'physical-books', image: '📘' });
                setShowAddForm(false);
            };
            const handleDeleteProduct = (id) => { if (window.confirm('Delete this product?')) setProducts(products.filter(p => p.id !== id)); };

            return (
                <div className="min-h-screen bg-gray-50 py-12">
                    <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-900">Publisher Dashboard</h1>
                            <button onClick={() => setPage('home')} className="text-indigo-600 hover:underline font-medium">← Back to Site</button>
                        </div>
                        <div className="flex gap-4 mb-6 border-b border-gray-200">
                            <button onClick={() => setTab('products')} className={`pb-2 px-4 font-medium ${tab === 'products' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-gray-500'}`}>My Products</button>
                            <button onClick={() => setTab('sales')} className={`pb-2 px-4 font-medium ${tab === 'sales' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-gray-500'}`}>My Sales ({myOrders.length})</button>
                        </div>
                        {tab === 'products' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold">My Inventory</h2>
                                    <button onClick={() => setShowAddForm(!showAddForm)} className="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">+ Add New Product</button>
                                </div>
                                {showAddForm && (
                                    <form onSubmit={handleAddProduct} className="bg-white p-6 rounded-xl border border-gray-200 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4 shadow-sm">
                                        <input required placeholder="Product Name" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-indigo-500" />
                                        <input required placeholder="Author / Brand" value={newProduct.author} onChange={e => setNewProduct({...newProduct, author: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-indigo-500" />
                                        <input required type="number" placeholder="Price (e.g., 15000)" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-indigo-500" />
                                        <select value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-indigo-500 bg-white">
                                            {categories.filter(c => c !== 'all').map(cat => <option key={cat} value={cat}>{categoryLabels[cat]}</option>)}
                                        </select>
                                        <input required placeholder="Emoji Icon (e.g., )" value={newProduct.image} onChange={e => setNewProduct({...newProduct, image: e.target.value})} className="border border-gray-300 p-3 rounded-lg outline-none focus:border-indigo-500 md:col-span-2" />
                                        <div className="flex gap-3 md:col-span-2">
                                            <button type="button" onClick={() => setShowAddForm(false)} className="flex-1 border border-gray-300 text-gray-700 p-3 rounded-lg hover:bg-gray-50">Cancel</button>
                                            <button type="submit" className="flex-1 bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 font-medium">Save Product</button>
                                        </div>
                                    </form>
                                )}
                                <div className="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                                    {myProducts.length === 0 ? (
                                        <div className="p-12 text-center text-gray-500">You haven't added any products yet.</div>
                                    ) : (
                                        <table className="w-full text-left">
                                            <thead className="bg-gray-50"><tr><th className="p-4 text-sm font-semibold text-gray-600">Icon</th><th className="p-4 text-sm font-semibold text-gray-600">Name</th><th className="p-4 text-sm font-semibold text-gray-600">Category</th><th className="p-4 text-sm font-semibold text-gray-600">Price</th><th className="p-4 text-sm font-semibold text-gray-600">Action</th></tr></thead>
                                            <tbody>
                                                {myProducts.map(p => (
                                                    <tr key={p.id} className="border-t hover:bg-gray-50">
                                                        <td className="p-4 text-2xl">{p.image}</td>
                                                        <td className="p-4"><div className="font-medium text-gray-900">{p.name}</div><div className="text-sm text-gray-500">{p.author}</div></td>
                                                        <td className="p-4 capitalize text-sm text-gray-600">{p.category.replace('-', ' ')}</td>
                                                        <td className="p-4 font-medium text-gray-900">₦{p.price.toLocaleString()}</td>
                                                        <td className="p-4"><button onClick={() => handleDeleteProduct(p.id)} className="text-red-600 hover:text-red-800 text-sm font-medium bg-red-50 px-3 py-1.5 rounded-lg hover:bg-red-100 transition-colors">Delete</button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        )}
                        {tab === 'sales' && (
                            <div>
                                <h2 className="text-xl font-bold mb-4">My Sales History</h2>
                                {myOrders.length === 0 ? (
                                    <div className="bg-white p-12 rounded-xl border border-gray-200 text-center text-gray-500 shadow-sm"><div className="text-4xl mb-3"></div><p>No sales yet for your products.</p></div>
                                ) : (
                                    <div className="space-y-4">
                                        {myOrders.map(order => {
                                            const myItems = order.items.filter(i => myProductIds.includes(i.id));
                                            const myTotal = myItems.reduce((sum, i) => sum + (i.price * i.quantity), 0);
                                            return (
                                                <div key={order.id} className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                                                        <div><h3 className="font-bold text-lg text-gray-900">{order.customer.name}</h3><p className="text-sm text-gray-500">{order.date}</p></div>
                                                        <span className="bg-indigo-100 text-indigo-800 px-4 py-1.5 rounded-full text-sm font-bold">₦{myTotal.toLocaleString()}</span>
                                                    </div>
                                                    <div className="text-sm text-gray-600 mb-4 bg-gray-50 p-3 rounded-lg"><p className="mb-1">📍 {order.customer.address}</p><p>📞 {order.customer.phone}</p></div>
                                                    <div className="border-t pt-3 space-y-1">
                                                        {myItems.map((item, idx) => (
                                                            <div key={idx} className="flex justify-between text-sm"><span className="text-gray-700">{item.quantity}x {item.name}</span><span className="font-medium text-gray-900">₦{(item.price * item.quantity).toLocaleString()}</span></div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [page, setPage] = useState('home');
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [isPubAuth, setIsPubAuth] = useState(false);
            const [cart, setCart] = useState([]);
            
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('a1_products_v3');
                return saved ? JSON.parse(saved) : defaultProducts;
            });
            const [orders, setOrders] = useState(() => {
                const saved = localStorage.getItem('a1_orders_v3');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => { localStorage.setItem('a1_products_v3', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('a1_orders_v3', JSON.stringify(orders)); }, [orders]);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    return [...prev, { ...product, quantity: 1 }];
                });
                alert(`${product.name} added to cart!`);
            };
            const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
            const updateQuantity = (id, change) => setCart(prev => prev.map(item => item.id === id ? { ...item, quantity: Math.max(1, item.quantity + change) } : item));

            const handleCheckout = (customer, cartItems, totalAmount) => {
                const newOrder = { id: Date.now().toString(), date: new Date().toLocaleString(), customer, items: cartItems, total: totalAmount };
                setOrders(prev => [newOrder, ...prev]);
                let message = `*🛒 New Order - A-One Bookshop*\n\n*Customer Details:*\nName: ${customer.name}\nAddress: ${customer.address}\nPhone: ${customer.phone}\n\n*Order Items:*\n`;
                cartItems.forEach(item => { message += `- ${item.quantity}x ${item.name} (₦${(item.price * item.quantity).toLocaleString()})\n`; });
                message += `\n*Total Amount: ₦${totalAmount.toLocaleString()}*`;
                window.open(`https://wa.me/2348140730041?text=${encodeURIComponent(message)}`, '_blank');
                setCart([]);
                setPage('home');
            };

            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            return (
                <div className="min-h-screen bg-gray-50">
                    {page !== 'admin-login' && page !== 'publisher-login' && <Navbar currentPage={page} setPage={setPage} cartCount={cartCount} />}
                    {page === 'home' && <Home setPage={setPage} products={products} />}
                    {page === 'shop' && <Shop addToCart={addToCart} products={products} />}
                    {page === 'cart' && <Cart cart={cart} removeFromCart={removeFromCart} updateQuantity={updateQuantity} onCheckout={handleCheckout} />}
                    
                    {page === 'admin-login' && <LoginGate title="Admin Access Only" password={ADMIN_PASSWORD} onLogin={() => { setIsAdminAuth(true); setPage('admin'); }} setPage={setPage} themeColor="amber" />}
                    {page === 'admin' && isAdminAuth && <Admin products={products} setProducts={setProducts} orders={orders} setOrders={setOrders} setPage={setPage} />}
                    {page === 'admin' && !isAdminAuth && <LoginGate title="Admin Access Only" password={ADMIN_PASSWORD} onLogin={() => setIsAdminAuth(true)} setPage={setPage} themeColor="amber" />}

                    {page === 'publisher-login' && <LoginGate title="Publisher Portal" password={PUBLISHER_PASSWORD} onLogin={() => { setIsPubAuth(true); setPage('publisher'); }} setPage={setPage} themeColor="indigo" />}
                    {page === 'publisher' && isPubAuth && <Publisher products={products} setProducts={setProducts} orders={orders} setPage={setPage} />}
                    {page === 'publisher' && !isPubAuth && <LoginGate title="Publisher Portal" password={PUBLISHER_PASSWORD} onLogin={() => setIsPubAuth(true)} setPage={setPage} themeColor="indigo" />}

                    <WhatsAppButton />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
