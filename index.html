<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-One Bookshop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        const products = [
            { id: '1', name: 'Art of Programming', author: 'D. Knuth', price: 45000, icon: '📘' },
            { id: '2', name: 'Web Development', author: 'S. Chen', price: 38500, icon: '💻' },
            { id: '3', name: 'Design Thinking', author: 'T. Brown', price: 32000, icon: '📙' },
            { id: '4', name: 'Notebook Set', author: 'A1', price: 18900, icon: '📓' },
            { id: '5', name: 'Pen Collection', author: 'A1', price: 12500, icon: '🖊️' },
            { id: '6', name: 'Sketch Pad', author: 'A1', price: 22000, icon: '📒' }
        ];

        function App() {
            const [page, setPage] = useState('home');
            const [cart, setCart] = useState([]);
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            const addToCart = (p) => {
                setCart(prev => {
                    const ex = prev.find(i => i.id === p.id);
                    return ex ? prev.map(i => i.id === p.id ? {...i, quantity: i.quantity+1} : i) : [...prev, {...p, quantity: 1}];
                });
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(i => i.id !== id));
            const updateQty = (id, delta) => setCart(prev => prev.map(i => i.id === id ? {...i, quantity: Math.max(1, i.quantity+delta)} : i));
            const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);

            const handleCheckout = (e) => {
                e.preventDefault();
                const name = e.target.name.value;
                const addr = e.target.address.value;
                const phone = e.target.phone.value;
                if(!name || !addr || !phone) return alert('Fill all fields');
                
                let msg = `*New Order - A-One Bookshop*\n\n*Customer:* ${name}\n*Address:* ${addr}\n*Phone:* ${phone}\n\n*Items:*\n`;
                cart.forEach(i => msg += `- ${i.quantity}x ${i.name} (N${(i.price*i.quantity).toLocaleString()})\n`);
                msg += `\n*Total: N${total.toLocaleString()}*`;
                
                window.open(`https://wa.me/2348140730041?text=${encodeURIComponent(msg)}`, '_blank');
            };

            return (
                <div className="min-h-screen bg-gray-50 font-sans">
                    <nav className="bg-white border-b border-amber-100 sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                            <button onClick={() => setPage('home')} className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-amber-600 rounded-lg flex items-center justify-center text-white font-bold">A1</div>
                                <span className="font-bold text-gray-900">A-One Bookshop</span>
                            </button>
                            <div className="flex gap-2">
                                <button onClick={() => setPage('home')} className={`px-4 py-2 rounded-full text-sm font-medium ${page==='home'?'bg-amber-50 text-amber-700':'text-gray-600'}`}>Home</button>
                                <button onClick={() => setPage('shop')} className={`px-4 py-2 rounded-full text-sm font-medium ${page==='shop'?'bg-amber-50 text-amber-700':'text-gray-600'}`}>Shop</button>
                                <button onClick={() => setPage('cart')} className="relative px-4 py-2 rounded-full bg-amber-600 text-white text-sm font-medium flex items-center gap-2">
                                    Cart {cartCount > 0 && <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">{cartCount}</span>}
                                </button>
                            </div>
                        </div>
                    </nav>

                    {page === 'home' && (
                        <div className="max-w-7xl mx-auto px-4 py-20 text-center">
                            <h1 className="text-5xl font-bold text-gray-900 mb-6">Your Trusted <span className="text-amber-600">Bookshop</span></h1>
                            <p className="text-xl text-gray-600 mb-8">Ibadan's destination for books and stationery.</p>
                            <button onClick={() => setPage('shop')} className="bg-amber-600 text-white px-8 py-3 rounded-full font-medium hover:bg-amber-700">Browse Collection</button>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
                                {products.slice(0, 3).map(p => (
                                    <div key={p.id} className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                                        <div className="text-5xl mb-4">{p.icon}</div>
                                        <h3 className="font-bold text-lg">{p.name}</h3>
                                        <p className="text-gray-500 text-sm mb-2">by {p.author}</p>
                                        <span className="text-amber-600 font-bold">N{p.price.toLocaleString()}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {page === 'shop' && (
                        <div className="max-w-7xl mx-auto px-4 py-12">
                            <h1 className="text-3xl font-bold mb-8">Our Collection</h1>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                {products.map(p => (
                                    <div key={p.id} className="bg-white rounded-2xl border border-gray-100 overflow-hidden hover:shadow-lg transition-all">
                                        <div className="bg-amber-50 p-12 flex items-center justify-center text-6xl">{p.icon}</div>
                                        <div className="p-5">
                                            <h3 className="font-bold text-lg">{p.name}</h3>
                                            <p className="text-gray-500 text-sm mb-4">by {p.author}</p>
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-lg">N{p.price.toLocaleString()}</span>
                                                <button onClick={() => addToCart(p)} className="px-4 py-2 bg-amber-600 text-white rounded-full text-sm font-medium hover:bg-amber-700">Add</button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {page === 'cart' && (cart.length === 0 ? (
                        <div className="max-w-7xl mx-auto px-4 py-20 text-center">
                            <h2 className="text-2xl font-bold mb-4">Your cart is empty</h2>
                            <button onClick={() => setPage('shop')} className="text-amber-600 font-medium">Go to Shop</button>
                        </div>
                    ) : (
                        <div className="max-w-4xl mx-auto px-4 py-12 grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="bg-white rounded-2xl border border-gray-100 p-6">
                                <h2 className="text-xl font-bold mb-4">Your Items</h2>
                                <div className="space-y-4">
                                    {cart.map(i => (
                                        <div key={i.id} className="flex justify-between items-center border-b border-gray-100 pb-4">
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">{i.icon}</span>
                                                <div>
                                                    <p className="font-medium">{i.name}</p>
                                                    <p className="text-sm text-gray-500">N{i.price.toLocaleString()}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => updateQty(i.id, -1)} className="w-6 h-6 rounded bg-gray-100">-</button>
                                                <span className="w-6 text-center">{i.quantity}</span>
                                                <button onClick={() => updateQty(i.id, 1)} className="w-6 h-6 rounded bg-gray-100">+</button>
                                                <button onClick={() => removeFromCart(i.id)} className="ml-2 text-red-500 text-sm">Remove</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-6 pt-4 border-t flex justify-between items-center">
                                    <span className="font-bold text-lg">Total:</span>
                                    <span className="text-2xl font-bold text-amber-600">N{total.toLocaleString()}</span>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl border border-gray-100 p-6">
                                <h2 className="text-xl font-bold mb-4">Delivery Details</h2>
                                <form onSubmit={handleCheckout} className="space-y-4">
                                    <input name="name" type="text" placeholder="Full Name" className="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-amber-300" required />
                                    <input name="address" type="text" placeholder="Delivery Address" className="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-amber-300" required />
                                    <input name="phone" type="tel" placeholder="Phone Number" className="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-amber-300" required />
                                    <button type="submit" className="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-700">Order via WhatsApp</button>
                                </form>
                            </div>
                        </div>
                    ))}

                    <a href="https://wa.me/2348140730041" target="_blank" className="fixed bottom-6 right-6 w-14 h-14 bg-green-500 rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition-transform">
                        <svg className="w-7 h-7 text-white fill-current" viewBox="0 0 24 24"><path d="M20.52 3.449C12.831-3.984.106 1.407.101 11.893c0 2.096.549 4.14 1.595 5.945L0 24l6.335-1.652c7.926 4.156 17.389-1.59 17.394-10.447 0-3.176-1.24-6.165-3.483-8.402l.274-.052zM12.056 21.785c-1.675-.001-3.314-.452-4.745-1.305l-.34-.202-3.514.918.952-3.427-.222-.352c-2.066-3.284-1.526-7.58.899-10.351 2.425-2.771 6.512-3.612 9.898-2.026 3.386 1.586 5.448 5.074 4.97 8.721-.478 3.648-3.546 6.524-7.234 6.624h-.664z"/></svg>
                    </a>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
