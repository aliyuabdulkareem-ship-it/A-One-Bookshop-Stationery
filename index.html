<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A-One Bookshop & Stationery — Ibadan's trusted bookstore for physical books, e-books, audiobooks, magazines, and quality stationery." />
    <title>A-One Bookshop & Stationery | Books & Stationery in Ibadan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { scrollbar-width: thin; scrollbar-color: #d4a574 transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const products = [
            { id: '1', name: 'The Art of Programming', author: 'Donald Knuth', price: 45.99, category: 'physical-books', image: '📘', stock: 25 },
            { id: '2', name: 'Modern Web Development', author: 'Sarah Chen', price: 38.50, category: 'ebooks', image: '📱', stock: 999 },
            { id: '3', name: 'Design Thinking', author: 'Tim Brown', price: 32.00, category: 'physical-books', image: '📙', stock: 30 },
            { id: '4', name: 'Premium Notebook Set', author: 'A1 Stationery', price: 18.99, category: 'stationery', image: '📓', stock: 50 },
            { id: '5', name: 'Fine Tip Pen Collection', author: 'A1 Stationery', price: 12.50, category: 'stationery', image: '🖊️', stock: 75 },
            { id: '6', name: 'Artist Sketch Pad', author: 'A1 Stationery', price: 22.00, category: 'art-supplies', image: '📒', stock: 35 },
        ];

        // --- NEW: WHATSAPP BUTTON ---
        function WhatsAppButton() {
            return (
                <a 
                    href="https://wa.me/2348140730041?text=Hello!%20I%20would%20like%20to%20inquire%20about%20your%20products." 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    className="fixed bottom-6 right-6 z-50 group"
                    aria-label="Chat with us on WhatsApp"
                >
                    <div className="relative">
                        {/* Pulse animation */}
                        <div className="absolute inset-0 bg-green-500 rounded-full animate-ping opacity-20"></div>
                        {/* The Button */}
                        <div className="relative w-14 h-14 bg-green-500 rounded-full flex items-center justify-center shadow-lg hover:bg-green-600 hover:scale-110 transition-all duration-300">
                            <svg className="w-7 h-7 text-white fill-current" viewBox="0 0 24 24">
                                <path d="M20.52 3.449C12.831-3.984.106 1.407.101 11.893c0 2.096.549 4.14 1.595 5.945L0 24l6.335-1.652c7.926 4.156 17.389-1.59 17.394-10.447 0-3.176-1.24-6.165-3.483-8.402l.274-.052zM12.056 21.785c-1.675-.001-3.314-.452-4.745-1.305l-.34-.202-3.514.918.952-3.427-.222-.352c-2.066-3.284-1.526-7.58.899-10.351 2.425-2.771 6.512-3.612 9.898-2.026 3.386 1.586 5.448 5.074 4.97 8.721-.478 3.648-3.546 6.524-7.234 6.624h-.664z"/>
                            </svg>
                        </div>
                        {/* Tooltip on hover */}
                        <div className="absolute right-full mr-3 top-1/2 -translate-y-1/2 bg-gray-900 text-white text-sm px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
                            Chat with us
                            <div className="absolute left-full top-1/2 -translate-y-1/2 border-4 border-transparent border-l-gray-900"></div>
                        </div>
                    </div>
                </a>
            );
        }
        // --- END WHATSAPP BUTTON ---

        function Navbar({ currentPage, setPage }) {
            return (
                <nav className="bg-white/80 backdrop-blur-md border-b border-amber-100 sticky top-0 z-40">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-16">
                            <button onClick={() => setPage('home')} className="flex items-center gap-2.5">
                                <div className="w-9 h-9 bg-gradient-to-br from-amber-500 to-amber-700 rounded-lg flex items-center justify-center">
                                    <span className="text-white text-lg">📚</span>
                                </div>
                                <span className="text-lg font-bold text-gray-900">A-One <span className="text-amber-600">Bookshop</span></span>
                            </button>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setPage('home')} className={`px-4 py-2 rounded-full text-sm font-medium transition-all ${currentPage === 'home' ? 'bg-amber-50 text-amber-700' : 'text-gray-600 hover:bg-gray-50'}`}>Home</button>
                                <button onClick={() => setPage('shop')} className={`px-4 py-2 rounded-full text-sm font-medium transition-all ${currentPage === 'shop' ? 'bg-amber-50 text-amber-700' : 'text-gray-600 hover:bg-gray-50'}`}>Shop</button>
                                <button onClick={() => setPage('login')} className="px-4 py-2 rounded-full bg-amber-600 text-white text-sm font-medium hover:bg-amber-700">Sign In</button>
                            </div>
                        </div>
                    </div>
                </nav>
            );
        }

        function Home({ setPage }) {
            const featured = products.slice(0, 3);
            return (
                <div className="min-h-screen">
                    <section className="relative overflow-hidden bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24 md:py-36">
                            <div className="max-w-2xl">
                                <div className="inline-flex items-center gap-2 bg-white/80 backdrop-blur-sm px-4 py-2 rounded-full text-sm text-amber-700 font-medium mb-6 shadow-sm">
                                    ✨ Serving Ibadan with Quality Books & Stationery
                                </div>
                                <h1 className="text-5xl md:text-6xl font-bold text-gray-900 leading-tight mb-6">
                                    Your Trusted <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-600 to-orange-600">Bookshop</span>
                                </h1>
                                <p className="text-lg text-gray-600 mb-8 leading-relaxed">
                                    Welcome to <strong>A-One Bookshop & Stationery</strong> — Ibadan's destination for physical books, e-books, audiobooks, magazines, and premium stationery.
                                </p>
                                <div className="flex flex-wrap gap-4">
                                    <button onClick={() => setPage('shop')} className="inline-flex items-center gap-2 bg-amber-600 text-white px-7 py-3.5 rounded-full font-medium hover:bg-amber-700 transition-all hover:shadow-lg">
                                        Browse Collection →
                                    </button>
                                    <a href="https://wa.me/2348140730041" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-green-600 text-white px-7 py-3.5 rounded-full font-medium hover:bg-green-700 transition-all hover:shadow-lg">
                                        Chat on WhatsApp
                                    </a>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section className="py-20 bg-gray-50/50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center mb-12">
                                <h2 className="text-3xl font-bold text-gray-900 mb-3">What We Offer</h2>
                                <p className="text-gray-500 max-w-md mx-auto">From physical books to digital content — everything for the modern reader.</p>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
                                {[{ icon: '📘', label: 'Physical Books' }, { icon: '📱', label: 'E-Books' }, { icon: '', label: 'Audiobooks' }, { icon: '📰', label: 'Magazines' }, { icon: '✏️', label: 'Stationery' }, { icon: '🎨', label: 'Art Supplies' }, { icon: '📎', label: 'Office' }].map(cat => (
                                    <div key={cat.label} className="bg-white rounded-2xl p-4 border border-gray-100 hover:shadow-md transition-all text-center">
                                        <div className="text-3xl mb-2">{cat.icon}</div>
                                        <h3 className="font-semibold text-gray-900 text-sm">{cat.label}</h3>
                                    </div>
                                ))}
                            </div>

                            <div className="text-center mt-16 mb-8">
                                <h2 className="text-2xl font-bold text-gray-900 mb-3">Featured Products</h2>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {featured.map(product => (
                                    <div key={product.id} className="bg-white rounded-2xl p-6 border border-gray-100 hover:shadow-lg transition-all">
                                        <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-xl p-6 flex items-center justify-center mb-4">
                                            <span className="text-5xl">{product.image}</span>
                                        </div>
                                        <h3 className="font-semibold text-gray-900 text-lg mb-1">{product.name}</h3>
                                        <p className="text-sm text-gray-500 mb-3">by {product.author}</p>
                                        <div className="flex items-center justify-between">
                                            <span className="text-lg font-bold text-amber-600">${product.price.toFixed(2)}</span>
                                            <span className="text-xs text-gray-400 capitalize">{product.category.replace('-', ' ')}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section className="py-16 bg-white border-t border-gray-100">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center mb-10">
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">Get in Touch</h2>
                                <p className="text-gray-500">We're here to help you find what you need</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <a href="tel:+2348140730041" className="flex items-center gap-4 p-5 rounded-2xl bg-gray-50 hover:bg-amber-50 transition-colors">
                                    <div className="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm"><span className="text-xl">📞</span></div>
                                    <div><p className="text-xs text-gray-500 mb-0.5">Call Us</p><p className="font-semibold text-gray-900">+234 814 073 0041</p></div>
                                </a>
                                <div className="flex items-center gap-4 p-5 rounded-2xl bg-gray-50">
                                    <div className="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm"><span className="text-xl">🕐</span></div>
                                    <div><p className="text-xs text-gray-500 mb-0.5">Open Hours</p><p className="font-semibold text-gray-900 text-sm">Mon–Sat: 8AM – 6PM</p></div>
                                </div>
                                <a href="https://www.google.com/maps/search/Ibadan-Abeokuta+Road+Apata+Ibadan" target="_blank" rel="noopener noreferrer" className="flex items-center gap-4 p-5 rounded-2xl bg-gray-50 hover:bg-amber-50 transition-colors">
                                    <div className="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm"><span className="text-xl">📍</span></div>
                                    <div><p className="text-xs text-gray-500 mb-0.5">Visit Us</p><p className="font-semibold text-gray-900 text-sm">Ibadan-Abeokuta Rd, Apata</p></div>
                                </a>
                            </div>
                        </div>
                    </section>

                    <footer className="bg-gray-900 text-white py-12">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                            <p className="text-sm text-gray-400">© 2026 A-One Bookshop & Stationery. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        function Shop() {
            const [search, setSearch] = useState('');
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(search.toLowerCase()) || 
                p.author.toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div className="min-h-screen bg-gray-50/50">
                    <div className="bg-white border-b border-gray-100">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            <h1 className="text-3xl font-bold text-gray-900">Our Collection</h1>
                        </div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div className="mb-6">
                            <input 
                                type="text" 
                                placeholder="Search books, stationery..." 
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none"
                            />
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {filtered.map(product => (
                                <div key={product.id} className="bg-white rounded-2xl border border-gray-100 overflow-hidden hover:shadow-xl transition-all">
                                    <div className="bg-gradient-to-br from-amber-50 to-orange-50 p-8 flex items-center justify-center h-48">
                                        <span className="text-6xl">{product.image}</span>
                                    </div>
                                    <div className="p-5">
                                        <h3 className="font-semibold text-gray-900 text-lg mb-1">{product.name}</h3>
                                        <p className="text-sm text-gray-500 mb-2">by {product.author}</p>
                                        <div className="flex items-center justify-between">
                                            <span className="text-xl font-bold text-gray-900">${product.price.toFixed(2)}</span>
                                            <button className="px-4 py-2 bg-amber-600 text-white rounded-full text-sm font-medium hover:bg-amber-700">
                                                Add to Cart
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function Login() {
            return (
                <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-xl border border-gray-100 p-8 max-w-md w-full">
                        <h2 className="text-2xl font-bold text-gray-900 mb-1">Welcome back</h2>
                        <p className="text-sm text-gray-500 mb-6">Sign in to your account</p>
                        <div className="space-y-4">
                            <input type="email" placeholder="Email" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" />
                            <input type="password" placeholder="Password" className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" />
                            <button className="w-full bg-amber-600 text-white py-3 rounded-xl font-medium hover:bg-amber-700">Sign In</button>
                        </div>
                        <p className="text-center text-sm text-gray-500 mt-6">
                            Demo: admin@a1bookshop.com / admin123
                        </p>
                    </div>
                </div>
            );
        }

        function App() {
            const [page, setPage] = useState('home');
            return (
                <div className="min-h-screen bg-gray-50">
                    <Navbar currentPage={page} setPage={setPage} />
                    {page === 'home' && <Home setPage={setPage} />}
                    {page === 'shop' && <Shop />}
                    {page === 'login' && <Login />}
                    {/* Render the WhatsApp button here so it shows on all pages */}
                    <WhatsAppButton />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
