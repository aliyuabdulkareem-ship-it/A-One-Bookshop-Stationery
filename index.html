        // Reusable Add Product Form with File Upload
        function ProductForm({ onSubmit, onCancel, accentColor = 'amber' }) {
            const [form, setForm] = useState({ name: '', author: '', price: '', category: 'physical-books', image: '', pdfFile: null, pdfName: '' });
            const [imagePreview, setImagePreview] = useState(null);
            const fileInputRef = useRef(null);
            const pdfInputRef = useRef(null);

            const accentClasses = {
                amber: 'focus:border-amber-500',
                indigo: 'focus:border-indigo-500',
            };
            const btnClasses = {
                amber: 'bg-amber-600 hover:bg-amber-700',
                indigo: 'bg-indigo-600 hover:bg-indigo-700',
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) {
                    alert('Image is too large. Please use an image under 2MB.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    setImagePreview(ev.target.result);
                    setForm({ ...form, image: ev.target.result });
                };
                reader.readAsDataURL(file);
            };

            const handlePdfUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 10 * 1024 * 1024) {
                    alert('PDF is too large. Please use a file under 10MB.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    setForm({ ...form, pdfFile: ev.target.result, pdfName: file.name });
                };
                reader.readAsDataURL(file);
            };

            const isDigital = ['ebooks', 'audiobooks'].includes(form.category);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!form.name || !form.author || !form.price) return alert('Please fill in all required fields');
                onSubmit({
                    name: form.name,
                    author: form.author,
                    price: Number(form.price),
                    category: form.category,
                    image: form.image,
                    pdfFile: form.pdfFile,
                    pdfName: form.pdfName,
                });
            };

            return (
                <form onSubmit={handleSubmit} className="bg-white p-6 rounded-xl border border-gray-200 mb-6 grid grid-cols-1 md:grid-cols-2 gap-4 shadow-sm">
                    <input required placeholder="Product Name" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className={`border border-gray-300 p-3 rounded-lg outline-none ${accentClasses[accentColor]}`} />
                    <input required placeholder="Author / Brand" value={form.author} onChange={e => setForm({ ...form, author: e.target.value })} className={`border border-gray-300 p-3 rounded-lg outline-none ${accentClasses[accentColor]}`} />
                    <input required type="number" placeholder="Price (e.g., 15000)" value={form.price} onChange={e => setForm({ ...form, price: e.target.value })} className={`border border-gray-300 p-3 rounded-lg outline-none ${accentClasses[accentColor]}`} />
                    <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value, pdfFile: null, pdfName: '' })} className={`border border-gray-300 p-3 rounded-lg outline-none ${accentClasses[accentColor]} bg-white`}>
                        {categories.filter(c => c !== 'all').map(cat => <option key={cat} value={cat}>{categoryLabels[cat]}</option>)}
                    </select>

                    {/* Cover Image Upload */}
                    <div className="md:col-span-2 border border-dashed border-gray-300 rounded-lg p-4">
                        <p className="text-sm font-medium text-gray-700 mb-2">Product Cover (Optional)</p>
                        <div className="flex flex-col md:flex-row gap-3 items-start">
                            <div className="flex-1">
                                <p className="text-xs text-gray-500 mb-2">Option A: Upload an image (JPG/PNG, max 2MB)</p>
                                <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageUpload} className="w-full text-sm text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200" />
                            </div>
                            <div className="flex-1">
                                <p className="text-xs text-gray-500 mb-2">Option B: Use an emoji instead</p>
                                <input placeholder="e.g., 📘 (leave empty if uploaded image)" value={form.image && !form.image.startsWith('data:') ? form.image : ''} onChange={e => { setForm({ ...form, image: e.target.value }); setImagePreview(null); }} className="w-full border border-gray-300 p-2 rounded-lg outline-none text-lg" />
                            </div>
                            {imagePreview && (
                                <div className="w-20 h-20 flex-shrink-0 rounded-lg overflow-hidden border border-gray-200">
                                    <img src={imagePreview} alt="Preview" className="w-full h-full object-contain" />
                                </div>
                            )}
                        </div>
                    </div>

                    {/* PDF Upload for Digital Products */}
                    {isDigital && (
                        <div className="md:col-span-2 border border-dashed border-purple-300 bg-purple-50 rounded-lg p-4">
                            <p className="text-sm font-medium text-purple-900 mb-2">Digital File Upload (PDF/MP3, max 10MB)</p>
                            <p className="text-xs text-purple-700 mb-2">Customers will receive a download link via WhatsApp after purchase.</p>
                            <input type="file" accept=".pdf,.mp3,.epub,.mobi" ref={pdfInputRef} onChange={handlePdfUpload} className="w-full text-sm text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200" />
                            {form.pdfName && <p className="text-xs text-purple-700 mt-2">Selected: {form.pdfName}</p>}
                        </div>
                    )}

                    <div className="flex gap-3 md:col-span-2">
                        <button type="button" onClick={onCancel} className="flex-1 border border-gray-300 text-gray-700 p-3 rounded-lg hover:bg-gray-50">Cancel</button>
                        <button type="submit" className={`flex-1 ${btnClasses[accentColor]} text-white p-3 rounded-lg font-medium`}>Save Product</button>
                    </div>
                </form>
            );
        }

        function LoginGate({ title, password, onLogin, setPage, themeColor }) {
            const [input, setInput] = useState('');
            const [error, setError] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (input === password) onLogin();

                <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">

                            <input type="password" value={input} onChange={e => { setInput(e.target.value); setError(''); }} className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none text-center text-lg tracking-widest" placeholder="••••••••" autoFocus required />
                            {error && <div className="bg-red-50 text-red-600 text-sm p-3 rounded-xl text-center">{error}</div>}

                            <button type="button" onClick={() => setPage('home')} className="w-full text-gray-500 text-sm hover:text-gray-700 py-2">Back to Website</button>
                        </form>
                    </div>
                </div>
            );
        }

                                                    {order.items.map((item, idx) => (
                                                        <div key={idx} className="flex justify-between text-sm"><span className="text-gray-700">{item.quantity}x {item.name}</span><span className="font-medium text-gray-900">₦{(item.price * item.quantity).toLocaleString()}</span></div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function Publisher({ products, setProducts, orders, setPage }) {
            const [tab, setTab] = useState('products');
            const [showAddForm, setShowAddForm] = useState(false);

            const myProducts = products.filter(p => p.publisherId === PUBLISHER_ID);
            const myProductIds = myProducts.map(p => p.id);
            const myOrders = orders.filter(o => o.items.some(i => myProductIds.includes(i.id)));

            const handleAddProduct = (data) => {
                const product = { id: Date.now().toString(), ...data, publisherId: PUBLISHER_ID };
                setProducts([...products, product]);
                setShowAddForm(false);
            };
            const handleDeleteProduct = (id) => { if (window.confirm('Delete this product?')) setProducts(products.filter(p => p.id !== id)); };

            return (
                <div className="min-h-screen bg-gray-50 py-12">
                    <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-900">Publisher Dashboard</h1>
                            <button onClick={() => setPage('home')} className="text-indigo-600 hover:underline font-medium">Back to Site</button>
                        </div>
                        <div className="flex gap-4 mb-6 border-b border-gray-200">
                            <button onClick={() => setTab('products')} className={`pb-2 px-4 font-medium ${tab === 'products' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-gray-500'}`}>My Products</button>
                            <button onClick={() => setTab('sales')} className={`pb-2 px-4 font-medium ${tab === 'sales' ? 'border-b-2 border-indigo-600 text-indigo-600' : 'text-gray-500'}`}>My Sales ({myOrders.length})</button>
                        </div>
                        {tab === 'products' && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold">My Inventory</h2>
                                    <button onClick={() => setShowAddForm(!showAddForm)} className="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">+ Add New Product</button>
                                </div>
                                {showAddForm && <ProductForm onSubmit={handleAddProduct} onCancel={() => setShowAddForm(false)} accentColor="indigo" />}
                                <div className="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                                    {myProducts.length === 0 ? (
                                        <div className="p-12 text-center text-gray-500">You haven't added any products yet.</div>
                                    ) : (
                                        <table className="w-full text-left">
                                            <thead className="bg-gray-50"><tr><th className="p-4 text-sm font-semibold text-gray-600">Cover</th><th className="p-4 text-sm font-semibold text-gray-600">Name</th><th className="p-4 text-sm font-semibold text-gray-600">Category</th><th className="p-4 text-sm font-semibold text-gray-600">Price</th><th className="p-4 text-sm font-semibold text-gray-600">Action</th></tr></thead>
                                            <tbody>
                                                {myProducts.map(p => (
                                                    <tr key={p.id} className="border-t hover:bg-gray-50">
                                                        <td className="p-4">
                                                            {p.image && p.image.startsWith('data:') ? (
                                                                <img src={p.image} alt={p.name} className="w-10 h-10 object-contain rounded" />
                                                            ) : (
                                                                <span className="text-2xl">{p.image || '📦'}</span>
                                                            )}
                                                        </td>
                                                        <td className="p-4"><div className="font-medium text-gray-900">{p.name}</div><div className="text-sm text-gray-500">{p.author}</div>{p.pdfName && <div className="text-xs text-purple-600 mt-1">PDF: {p.pdfName}</div>}</td>
                                                        <td className="p-4 capitalize text-sm text-gray-600">{p.category.replace('-', ' ')}</td>
                                                        <td className="p-4 font-medium text-gray-900">₦{p.price.toLocaleString()}</td>
                                                        <td className="p-4"><button onClick={() => handleDeleteProduct(p.id)} className="text-red-600 hover:text-red-800 text-sm font-medium bg-red-50 px-3 py-1.5 rounded-lg hover:bg-red-100 transition-colors">Delete</button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        )}
                        {tab === 'sales' && (
                            <div>
                                <h2 className="text-xl font-bold mb-4">My Sales History</h2>
                                {myOrders.length === 0 ? (
                                    <div className="bg-white p-12 rounded-xl border border-gray-200 text-center text-gray-500 shadow-sm"><div className="text-4xl mb-3">📊</div><p>No sales yet for your products.</p></div>
                                ) : (
                                    <div className="space-y-4">
                                        {myOrders.map(order => {
                                            const myItems = order.items.filter(i => myProductIds.includes(i.id));
                                            const myTotal = myItems.reduce((sum, i) => sum + (i.price * i.quantity), 0);
                                            return (
                                                <div key={order.id} className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                                                        <div><h3 className="font-bold text-lg text-gray-900">{order.customer.name}</h3><p className="text-sm text-gray-500">{order.date}</p></div>
                                                        <span className="bg-indigo-100 text-indigo-800 px-4 py-1.5 rounded-full text-sm font-bold">₦{myTotal.toLocaleString()}</span>
                                                    </div>
                                                    <div className="text-sm text-gray-600 mb-4 bg-gray-50 p-3 rounded-lg"><p className="mb-1">📍 {order.customer.address}</p><p>📞 {order.customer.phone}</p></div>
                                                    <div className="border-t pt-3 space-y-1">
                                                        {myItems.map((item, idx) => (
                                                            <div key={idx} className="flex justify-between text-sm"><span className="text-gray-700">{item.quantity}x {item.name}</span><span className="font-medium text-gray-900">₦{(item.price * item.quantity).toLocaleString()}</span></div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [page, setPage] = useState('home');
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [isPubAuth, setIsPubAuth] = useState(false);
            const [cart, setCart] = useState([]);
            
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('a1_products_v4');
                return saved ? JSON.parse(saved) : defaultProducts;
            });
            const [orders, setOrders] = useState(() => {
                const saved = localStorage.getItem('a1_orders_v4');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => { localStorage.setItem('a1_products_v4', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('a1_orders_v4', JSON.stringify(orders)); }, [orders]);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    return [...prev, { ...product, quantity: 1 }];
                });
                alert(`${product.name} added to cart!`);
            };
            const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
            const updateQuantity = (id, change) => setCart(prev => prev.map(item => item.id === id ? { ...item, quantity: Math.max(1, item.quantity + change) } : item));

            const handleCheckout = (customer, cartItems, totalAmount) => {
                const newOrder = { id: Date.now().toString(), date: new Date().toLocaleString(), customer, items: cartItems, total: totalAmount };
                setOrders(prev => [newOrder, ...prev]);
                let message = `*New Order - A-One Bookshop*\n\n*Customer Details:*\nName: ${customer.name}\nAddress: ${customer.address}\nPhone: ${customer.phone}\n\n*Order Items:*\n`;
                cartItems.forEach(item => { message += `- ${item.quantity}x ${item.name} (N${(item.price * item.quantity).toLocaleString()})\n`; });
                message += `\n*Total Amount: N${totalAmount.toLocaleString()}*`;
                window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(message)}`, '_blank');
                setCart([]);
                setPage('home');
            };

            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            return (
                <div className="min-h-screen bg-gray-50">
                    {page !== 'admin-login' && page !== 'publisher-login' && page !== 'publisher-register' && <Navbar currentPage={page} setPage={setPage} cartCount={cartCount} />}
                    {page === 'home' && <Home setPage={setPage} products={products} />}
                    {page === 'shop' && <Shop addToCart={addToCart} products={products} />}
                    {page === 'cart' && <Cart cart={cart} removeFromCart={removeFromCart} updateQuantity={updateQuantity} onCheckout={handleCheckout} />}
                    
                    {page === 'admin-login' && <LoginGate title="Admin Access Only" password={ADMIN_PASSWORD} onLogin={() => { setIsAdminAuth(true); setPage('admin'); }} setPage={setPage} themeColor="amber" />}
                    {page === 'admin' && isAdminAuth && <Admin products={products} setProducts={setProducts} orders={orders} setOrders={setOrders} setPage={setPage} />}
                    {page === 'admin' && !isAdminAuth && <LoginGate title="Admin Access Only" password={ADMIN_PASSWORD} onLogin={() => setIsAdminAuth(true)} setPage={setPage} themeColor="amber" />}

                    {page === 'publisher-login' && <LoginGate title="Publisher Portal" password={PUBLISHER_PASSWORD} onLogin={() => { setIsPubAuth(true); setPage('publisher'); }} setPage={setPage} themeColor="indigo" />}
                    {page === 'publisher' && isPubAuth && <Publisher products={products} setProducts={setProducts} orders={orders} setPage={setPage} />}
                    {page === 'publisher' && !isPubAuth && <LoginGate title="Publisher Portal" password={PUBLISHER_PASSWORD} onLogin={() => setIsPubAuth(true)} setPage={setPage} themeColor="indigo" />}

                    {page === 'publisher-register' && <PublisherRegister setPage={setPage} />}

                    <WhatsAppButton />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
