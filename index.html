<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A-One Bookshop & Stationery — Ibadan's trusted bookstore" />
    <title>A-One Bookshop & Stationery | Books & Stationery in Ibadan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { scrollbar-width: thin; scrollbar-color: #d4a574 transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const products = [
            { id: '1', name: 'The Art of Programming', author: 'Donald Knuth', price: 45000, category: 'physical-books', image: '📘' },
            { id: '2', name: 'Modern Web Development', author: 'Sarah Chen', price: 38500, category: 'ebooks', image: '📱' },
            { id: '3', name: 'Design Thinking', author: 'Tim Brown', price: 32000, category: 'physical-books', image: '📙' },
            { id: '4', name: 'Premium Notebook Set', author: 'A1 Stationery', price: 18900, category: 'stationery', image: '📓' },
            { id: '5', name: 'Fine Tip Pen Collection', author: 'A1 Stationery', price: 12500, category: 'stationery', image: '🖊️' },
            { id: '6', name: 'Artist Sketch Pad', author: 'A1 Stationery', price: 22000, category: 'art-supplies', image: '📒' },
        ];

        // --- WHATSAPP FLOATING BUTTON ---
        function WhatsAppButton() {
            return (
                <a href="https://wa.me/2348140730041?text=Hello!%20I%20would%20like%20to%20inquire%20about%20your%20products." target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-50 group">
                    <div className="relative">
                        <div className="absolute inset-0 bg-green-500 rounded-full animate-ping opacity-20"></div>
                        <div className="relative w-14 h-14 bg-green-500 rounded-full flex items-center justify-center shadow-lg hover:bg-green-600 hover:scale-110 transition-all duration-300">
                            <svg className="w-7 h-7 text-white fill-current" viewBox="0 0 24 24"><path d="M20.52 3.449C12.831-3.984.106 1.407.101 11.893c0 2.096.549 4.14 1.595 5.945L0 24l6.335-1.652c7.926 4.156 17.389-1.59 17.394-10.447 0-3.176-1.24-6.165-3.483-8.402l.274-.052zM12.056 21.785c-1.675-.001-3.314-.452-4.745-1.305l-.34-.202-3.514.918.952-3.427-.222-.352c-2.066-3.284-1.526-7.58.899-10.351 2.425-2.771 6.512-3.612 9.898-2.026 3.386 1.586 5.448 5.074 4.97 8.721-.478 3.648-3.546 6.524-7.234 6.624h-.664z"/></svg>
                        </div>
                    </div>
                </a>
            );
        }

        // --- NAVBAR ---
        function Navbar({ currentPage, setPage, cartCount }) {
            return (
                <nav className="bg-white/80 backdrop-blur-md border-b border-amber-100 sticky top-0 z-40">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-16">
                            <button onClick={() => setPage('home')} className="flex items-center gap-2.5">
                                <div className="w-9 h-9 bg-gradient-to-br from-amber-500 to-amber-700 rounded-lg flex items-center justify-center">
                                    <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                                </div>
                                <span className="text-lg font-bold text-gray-900">A-One <span className="text-amber-600">Bookshop</span></span>
                            </button>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setPage('home')} className={`px-4 py-2 rounded-full text-sm font-medium transition-all ${currentPage === 'home' ? 'bg-amber-50 text-amber-700' : 'text-gray-600 hover:bg-gray-50'}`}>Home</button>
                                <button onClick={() => setPage('shop')} className={`px-4 py-2 rounded-full text-sm font-medium transition-all ${currentPage === 'shop' ? 'bg-amber-50 text-amber-700' : 'text-gray-600 hover:bg-gray-50'}`}>Shop</button>
                                <button onClick={() => setPage('cart')} className="relative px-4 py-2 rounded-full bg-amber-600 text-white text-sm font-medium hover:bg-amber-700 flex items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                    Cart
                                    {cartCount > 0 && <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">{cartCount}</span>}
                                </button>
                            </div>
                        </div>
                    </div>
                </nav>
            );
        }

        // --- HOME PAGE ---
        function Home({ setPage }) {
            const featured = products.slice(0, 3);
            return (
                <div className="min-h-screen">
                    <section className="relative overflow-hidden bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24 md:py-36">
                            <div className="max-w-2xl">
                                <div className="inline-flex items-center gap-2 bg-white/80 backdrop-blur-sm px-4 py-2 rounded-full text-sm text-amber-700 font-medium mb-6 shadow-sm">✨ Serving Ibadan with Quality Books & Stationery</div>
                                <h1 className="text-5xl md:text-6xl font-bold text-gray-900 leading-tight mb-6">Your Trusted <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-600 to-orange-600">Bookshop</span></h1>
                                <p className="text-lg text-gray-600 mb-8 leading-relaxed">Welcome to <strong>A-One Bookshop & Stationery</strong> — Ibadan's destination for physical books, e-books, and premium stationery.</p>
                                <div className="flex flex-wrap gap-4">
                                    <button onClick={() => setPage('shop')} className="inline-flex items-center gap-2 bg-amber-600 text-white px-7 py-3.5 rounded-full font-medium hover:bg-amber-700 transition-all hover:shadow-lg">Browse Collection →</button>
                                    <a href="https://wa.me/2348140730041" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-green-600 text-white px-7 py-3.5 rounded-full font-medium hover:bg-green-700 transition-all hover:shadow-lg">Chat on WhatsApp</a>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    <section className="py-20 bg-gray-50/50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <h2 className="text-3xl font-bold text-gray-900 mb-8 text-center">Featured Products</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {featured.map(product => (
                                    <div key={product.id} className="bg-white rounded-2xl p-6 border border-gray-100 hover:shadow-lg transition-all">
                                        <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-xl p-6 flex items-center justify-center mb-4"><span className="text-5xl">{product.image}</span></div>
                                        <h3 className="font-semibold text-gray-900 text-lg mb-1">{product.name}</h3>
                                        <p className="text-sm text-gray-500 mb-3">by {product.author}</p>
                                        <span className="text-lg font-bold text-amber-600">₦{product.price.toLocaleString()}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* --- GET IN TOUCH SECTION RESTORED --- */}
                    <section className="py-16 bg-white border-t border-gray-100">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center mb-10">
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">Get in Touch</h2>
                                <p className="text-gray-500">We're here to help you find what you need</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <a href="tel:+2348140730041" className="flex items-center gap-4 p-5 rounded-2xl bg-gray-50 hover:bg-amber-50 transition-colors">
                                    <div className="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm"><span className="text-xl">📞</span></div>
                                    <div><p className="text-xs text-gray-500 mb-0.5">Call Us</p><p className="font-semibold text-gray-900">+234 814 073 0041</p></div>
                                </a>
                                <div className="flex items-center gap-4 p-5 rounded-2xl bg-gray-50">
                                    <div className="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm"><span className="text-xl">🕐</span></div>
                                    <div><p className="text-xs text-gray-500 mb-0.5">Open Hours</p><p className="font-semibold text-gray-900 text-sm">Mon–Sat: 8AM – 6PM</p></div>
                                </div>
                                <a href="https://www.google.com/maps/search/Ibadan-Abeokuta+Road+Apata+Ibadan" target="_blank" rel="noopener noreferrer" className="flex items-center gap-4 p-5 rounded-2xl bg-gray-50 hover:bg-amber-50 transition-colors">
                                    <div className="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm"><span className="text-xl">📍</span></div>
                                    <div><p className="text-xs text-gray-500 mb-0.5">Visit Us</p><p className="font-semibold text-gray-900 text-sm">Ibadan-Abeokuta Rd, Apata</p></div>
                                </a>
                            </div>
                        </div>
                    </section>

                    <footer className="bg-gray-900 text-white py-12"><div className="max-w-7xl mx-auto px-4 text-center"><p className="text-sm text-gray-400">© 2026 A-One Bookshop & Stationery. All rights reserved.</p></div></footer>
                </div>
            );
        }

        // --- SHOP PAGE ---
        function Shop({ addToCart }) {
            const [search, setSearch] = useState('');
            const filtered = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.author.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="min-h-screen bg-gray-50/50">
                    <div className="bg-white border-b border-gray-100"><div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8"><h1 className="text-3xl font-bold text-gray-900">Our Collection</h1></div></div>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <input type="text" placeholder="Search books, stationery..." value={search} onChange={e => setSearch(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none mb-6" />
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {filtered.map(product => (
                                <div key={product.id} className="bg-white rounded-2xl border border-gray-100 overflow-hidden hover:shadow-xl transition-all">
                                    <div className="bg-gradient-to-br from-amber-50 to-orange-50 p-8 flex items-center justify-center h-48"><span className="text-6xl">{product.image}</span></div>
                                    <div className="p-5">
                                        <h3 className="font-semibold text-gray-900 text-lg mb-1">{product.name}</h3>
                                        <p className="text-sm text-gray-500 mb-2">by {product.author}</p>
                                        <div className="flex items-center justify-between mt-4">
                                            <span className="text-xl font-bold text-gray-900">₦{product.price.toLocaleString()}</span>
                                            <button onClick={() => addToCart(product)} className="px-4 py-2 bg-amber-600 text-white rounded-full text-sm font-medium hover:bg-amber-700">Add to Cart</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- CART & CHECKOUT PAGE ---
        function Cart({ cart, removeFromCart, updateQuantity }) {
            const [name, setName] = useState('');
            const [address, setAddress] = useState('');
            const [phone, setPhone] = useState('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const handleCheckout = (e) => {
                e.preventDefault();
                if (!name || !address || !phone) return alert('Please fill in all details');

                let message = `*🛒 New Order - A-One Bookshop*\n\n`;
                message += `*Customer Details:*\nName: ${name}\nAddress: ${address}\nPhone: ${phone}\n\n`;
                message += `*Order Items:*\n`;
                
                cart.forEach(item => {
                    message += `- ${item.quantity}x ${item.name} (₦${(item.price * item.quantity).toLocaleString()})\n`;
                });
                
                message += `\n*Total Amount: ₦${total.toLocaleString()}*`;

                const whatsappUrl = `https://wa.me/2348140730041?text=${encodeURIComponent(message)}`;
                window.open(whatsappUrl, '_blank');
            };

            if (cart.length === 0) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                        <div className="text-center">
                            <div className="text-6xl mb-4">🛒</div>
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">Your cart is empty</h2>
                            <p className="text-gray-500">Add some books to get started!</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50/50 py-12">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                        <h1 className="text-3xl font-bold text-gray-900 mb-8">Checkout</h1>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="bg-white rounded-2xl border border-gray-100 p-6 h-fit">
                                <h2 className="text-xl font-bold text-gray-900 mb-4">Your Items</h2>
                                <div className="space-y-4">
                                    {cart.map(item => (
                                        <div key={item.id} className="flex items-center justify-between border-b border-gray-100 pb-4 last:border-0 last:pb-0">
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">{item.image}</span>
                                                <div>
                                                    <p className="font-medium text-gray-900">{item.name}</p>
                                                    <p className="text-sm text-gray-500">₦{item.price.toLocaleString()}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => updateQuantity(item.id, -1)} className="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200">-</button>
                                                <span className="w-6 text-center font-medium">{item.quantity}</span>
                                                <button onClick={() => updateQuantity(item.id, 1)} className="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200">+</button>
                                                <button onClick={() => removeFromCart(item.id)} className="ml-2 text-red-500 hover:text-red-700 text-sm">Remove</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-6 pt-4 border-t border-gray-200 flex justify-between items-center">
                                    <span className="text-lg font-bold text-gray-900">Total:</span>
                                    <span className="text-2xl font-bold text-amber-600">₦{total.toLocaleString()}</span>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl border border-gray-100 p-6 h-fit">
                                <h2 className="text-xl font-bold text-gray-900 mb-4">Delivery Details</h2>
                                <form onSubmit={handleCheckout} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                        <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" placeholder="John Doe" required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Delivery Address</label>
                                        <input type="text" value={address} onChange={e => setAddress(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" placeholder="123 Main St, Ibadan" required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                                        <input type="tel" value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none" placeholder="08012345678" required />
                                    </div>
                                    <button type="submit" className="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-700 transition-all flex items-center justify-center gap-2 mt-4">
                                        <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M20.52 3.449C12.831-3.984.106 1.407.101 11.893c0 2.096.549 4.14 1.595 5.945L0 24l6.335-1.652c7.926 4.156 17.389-1.59 17.394-10.447 0-3.176-1.24-6.165-3.483-8.402l.274-.052zM12.056 21.785c-1.675-.001-3.314-.452-4.745-1.305l-.34-.202-3.514.918.952-3.427-.222-.352c-2.066-3.284-1.526-7.58.899-10.351 2.425-2.771 6.512-3.612 9.898-2.026 3.386 1.586 5.448 5.074 4.97 8.721-.478 3.648-3.546 6.524-7.234 6.624h-.664z"/></svg>
                                        Order via WhatsApp
                                    </button>
                                    <p className="text-xs text-gray-500 text-center mt-2">This will open WhatsApp with your order details pre-filled.</p>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAIN APP ---
        function App() {
            const [page, setPage] = useState('home');
            const [cart, setCart] = useState([]);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
                alert(`${product.name} added to cart!`);
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));

            const updateQuantity = (id, change) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.quantity + change;
                        return newQty > 0 ? { ...item, quantity: newQty } : item;
                    }
                    return item;
                }));
            };

            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            return (
                <div className="min-h-screen bg-gray-50">
                    <Navbar currentPage={page} setPage={setPage} cartCount={cartCount} />
                    {page === 'home' && <Home setPage={setPage} />}
                    {page === 'shop' && <Shop addToCart={addToCart} />}
                    {page === 'cart' && <Cart cart={cart} removeFromCart={removeFromCart} updateQuantity={updateQuantity} />}
                    <WhatsAppButton />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
