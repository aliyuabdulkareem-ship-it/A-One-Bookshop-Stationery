    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;
        const { BrowserRouter, Routes, Route, Link, Navigate, useLocation, useNavigate } = ReactRouterDOM;

        // ==================== DATA ====================
        const categoryLabels = {

        };

        const initialProducts = [
            { id: '1', name: 'The Art of Programming', author: 'Donald Knuth', price: 45.99, category: 'physical-books', image: '📘', stock: 25, description: 'A comprehensive guide to computer programming fundamentals and algorithms.', publisherId: 'pub-1', isbn: '978-0-201-89683-9' },
            { id: '2', name: 'Modern Web Development', author: 'Sarah Chen', price: 38.50, category: 'ebooks', image: '📱', stock: 999, description: 'Learn the latest techniques in web development with React, TypeScript, and more. Digital delivery.', publisherId: 'pub-1', format: 'PDF, EPUB' },
            { id: '3', name: 'Design Thinking', author: 'Tim Brown', price: 32.00, category: 'physical-books', image: '📙', stock: 30, description: 'A powerful approach to innovation that starts with understanding user needs.', publisherId: 'pub-2', isbn: '978-0-06-173553-5' },
            { id: '4', name: 'The Great Novel - Audio Edition', author: 'James Mitchell', price: 19.99, category: 'audiobooks', image: '🎧', stock: 999, description: 'A captivating story narrated by award-winning voice actors. 12 hours of immersive storytelling.', publisherId: 'pub-2', format: 'MP3, Stream' },
            { id: '5', name: 'Science of Everything', author: 'Dr. Emily Park', price: 29.99, category: 'physical-books', image: '📓', stock: 15, description: 'An exploration of the fundamental principles that govern our universe.', publisherId: 'pub-1', isbn: '978-0-393-60939-1' },
            { id: '6', name: 'Premium Notebook Set', author: 'A1 Stationery', price: 18.99, category: 'stationery', image: '📓', stock: 50, description: 'Set of 3 premium lined notebooks with hardcover binding.', publisherId: 'pub-3' },
            { id: '7', name: 'Fine Tip Pen Collection', author: 'A1 Stationery', price: 12.50, category: 'stationery', image: '🖊️', stock: 75, description: 'Collection of 5 fine-tip pens in assorted colors.', publisherId: 'pub-3' },
            { id: '8', name: 'Artist Sketch Pad', author: 'A1 Stationery', price: 22.00, category: 'art-supplies', image: '📒', stock: 35, description: 'High-quality sketch pad with 100 sheets of premium paper.', publisherId: 'pub-3' },
            { id: '9', name: 'Desk Organizer', author: 'A1 Stationery', price: 34.99, category: 'office-supplies', image: '🗂️', stock: 20, description: 'Elegant wooden desk organizer with multiple compartments.', publisherId: 'pub-3' },
            { id: '10', name: 'Colored Marker Set', author: 'A1 Stationery', price: 28.00, category: 'art-supplies', image: '🖍️', stock: 40, description: 'Professional set of 24 vibrant colored markers.', publisherId: 'pub-3' },
            { id: '11', name: 'Mindful Living', author: 'Anna Roberts', price: 14.99, category: 'ebooks', image: '📱', stock: 999, description: 'A practical guide to living a more mindful and fulfilling life. Instant digital download.', publisherId: 'pub-2', format: 'PDF, EPUB, MOBI' },
            { id: '12', name: 'Tech Monthly - December', author: 'TechPress', price: 6.99, category: 'magazines', image: '📰', stock: 100, description: 'Latest issue covering AI breakthroughs, new gadgets, and industry trends.', publisherId: 'pub-4' },
        ];

        const DEMO_ACCOUNTS = [
            { email: 'admin@a1bookshop.com', password: 'admin123', user: { id: 'admin-1', name: 'Store Admin', email: 'admin@a1bookshop.com', role: 'admin', avatar: '👑' } },
            { email: 'publisher@techpress.com', password: 'pub123', user: { id: 'pub-1', name: 'TechPress Publishing', email: 'publisher@techpress.com', role: 'publisher', avatar: '📖', publisherName: 'TechPress Publishing' } },
            { email: 'user@example.com', password: 'user123', user: { id: 'user-1', name: 'John Reader', email: 'user@example.com', role: 'user', avatar: '👤' } },
        ];

        // ==================== CONTEXTS ====================
        const AuthContext = createContext();
        const StoreContext = createContext();

        // ==================== AUTH PROVIDER ====================
        function AuthProvider({ children }) {
            const [user, setUser] = useState(() => {
                try {
                    const stored = localStorage.getItem('a1_auth');
                    return stored ? JSON.parse(stored) : null;
                } catch { return null; }
            });

            useEffect(() => {
                if (user) localStorage.setItem('a1_auth', JSON.stringify(user));
                else localStorage.removeItem('a1_auth');
            }, [user]);

            const login = async (email, password) => {
                const account = DEMO_ACCOUNTS.find(a => a.email.toLowerCase() === email.toLowerCase() && a.password === password);
                if (account) { setUser(account.user); return true; }
                return false;
            };

            const loginWithGoogle = async () => {
                setUser({ id: 'google-' + Date.now(), name: 'Google User', email: 'googleuser@gmail.com', role: 'user', avatar: '🌐' });
                return true;
            };

            const signup = async (name, email, _password, role) => {
                setUser({ id: role === 'publisher' ? 'pub-' + Date.now() : 'user-' + Date.now(), name, email, role, avatar: role === 'publisher' ? '📖' : '👤', publisherName: role === 'publisher' ? name : undefined });
                return true;
            };

            const logout = () => setUser(null);

            return (
                <AuthContext.Provider value={{ user, login, loginWithGoogle, signup, logout, isAuthenticated: !!user, isAdmin: user?.role === 'admin', isPublisher: user?.role === 'publisher' }}>
                    {children}
                </AuthContext.Provider>
            );
        }

        // ==================== STORE PROVIDER ====================
        function StoreProvider({ children }) {
            const [products, setProducts] = useState(() => {
                try {
                    const stored = localStorage.getItem('a1_products_v2');
                    return stored ? JSON.parse(stored) : initialProducts;
                } catch { return initialProducts; }
            });
            const [cart, setCart] = useState(() => {
                try {
                    const stored = localStorage.getItem('a1_cart_v2');
                    return stored ? JSON.parse(stored) : [];
                } catch { return []; }
            });
            const [orders, setOrders] = useState(() => {
                try {
                    const stored = localStorage.getItem('a1_orders_v2');
                    return stored ? JSON.parse(stored) : [];
                } catch { return []; }
            });

            useEffect(() => { localStorage.setItem('a1_products_v2', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('a1_cart_v2', JSON.stringify(cart)); }, [cart]);
            useEffect(() => { localStorage.setItem('a1_orders_v2', JSON.stringify(orders)); }, [orders]);

            const addToCart = (product) => {
                const isDigital = ['ebooks', 'audiobooks'].includes(product.category);
                setCart(prev => {
                    const existing = prev.find(item => item.product.id === product.id);
                    if (existing) {
                        if (!isDigital && existing.quantity >= product.stock) return prev;
                        return prev.map(item => item.product.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { product, quantity: 1 }];
                });
            };

            const removeFromCart = (productId) => setCart(prev => prev.filter(item => item.product.id !== productId));

            const updateCartQuantity = (productId, quantity) => {
                if (quantity <= 0) { removeFromCart(productId); return; }
                setCart(prev => prev.map(item => {
                    if (item.product.id !== productId) return item;
                    const isDigital = ['ebooks', 'audiobooks'].includes(item.product.category);
                    if (isDigital) return { ...item, quantity };
                    return { ...item, quantity: Math.min(quantity, item.product.stock) };
                }));
            };

            const clearCart = () => setCart([]);

            const addProduct = (product) => {
                const newProduct = { ...product, id: Date.now().toString() };
                setProducts(prev => [...prev, newProduct]);
            };

            const updateProduct = (product) => setProducts(prev => prev.map(p => p.id === product.id ? product : p));

            const deleteProduct = (productId) => {
                setProducts(prev => prev.filter(p => p.id !== productId));
                setCart(prev => prev.filter(item => item.product.id !== productId));
            };

            const placeOrder = (customerName, customerEmail) => {
                const total = cart.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
                const order = { id: Date.now().toString(), items: [...cart], total, date: new Date().toISOString(), customerName, customerEmail };
                setOrders(prev => [order, ...prev]);
                setProducts(prev => prev.map(product => {
                    const cartItem = cart.find(item => item.product.id === product.id);
                    if (cartItem) {
                        const isDigital = ['ebooks', 'audiobooks'].includes(product.category);
                        if (isDigital) return product;
                        return { ...product, stock: Math.max(0, product.stock - cartItem.quantity) };
                    }
                    return product;
                }));
                clearCart();
            };

            const getProductsByPublisher = (publisherId) => products.filter(p => p.publisherId === publisherId);
            const cartTotal = cart.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            return (
                <StoreContext.Provider value={{ products, cart, orders, addToCart, removeFromCart, updateCartQuantity, clearCart, addProduct, updateProduct, deleteProduct, placeOrder, cartTotal, cartCount, getProductsByPublisher }}>
                    {children}
                </StoreContext.Provider>
            );
        }

        // ==================== HOOKS ====================
        function useAuth() { return useContext(AuthContext); }
        function useStore() { return useContext(StoreContext); }

            return (

                                    {cartCount > 0 && <span className="absolute -top-1 -right-1 w-5 h-5 bg-amber-600 text-white text-xs font-bold rounded-full flex items-center justify-center animate-pulse">{cartCount}</span>}

                                            <span className="hidden sm:block text-sm font-medium text-gray-700 max-w-[100px] truncate">{user?.name}</span>

                                        {userMenuOpen && (

                                                        <span className={`inline-block mt-1 text-xs font-medium px-2 py-0.5 rounded-full ${user?.role === 'admin' ? 'bg-amber-100 text-amber-700' : user?.role === 'publisher' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>

                                                    {user?.role === 'publisher' && <Link to="/publisher" onClick={() => setUserMenuOpen(false)} className="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-purple-50 transition-colors"><svg className="w-4 h-4 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>Publisher Dashboard</Link>}

                                                </div>

                                ) : (

                                    <div className="bg-white rounded-2xl border border-gray-100 p-5"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center"><span className="text-xl">🛒</span></div><div><p className="text-sm text-gray-500">Orders</p><p className="text-xl font-bold text-gray-900">{orders.length}</p></div></div></div>

                                    </div>

                                </div>
                            </div>
                        )}
                        {activeTab === 'inventory' && (
                            <div className="space-y-6">
                                <div className="flex flex-col sm:flex-row gap-4">
                                    <div className="relative flex-1"><svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg><input type="text" placeholder="Search inventory..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none text-sm bg-white" /></div>
                                    <select value={filterCategory} onChange={e => setFilterCategory(e.target.value)} className="px-4 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-600 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none bg-white"><option value="all">All Categories</option>{categoryOptions.map(cat => <option key={cat.value} value={cat.value}>{categoryLabels[cat.value]}</option>)}</select>
                                </div>
                                <div className="bg-white rounded-2xl border border-gray-100 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full">
                                            <thead><tr className="border-b border-gray-100 bg-gray-50/50"><th className="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Product</th><th className="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Category</th><th className="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Price</th><th className="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Stock</th><th className="text-right px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th></tr></thead>
                                            <tbody>{filteredProducts.map(product => { const isDigital = ['ebooks', 'audiobooks'].includes(product.category); return (<tr key={product.id} className="border-b border-gray-50 hover:bg-amber-50/30 transition-colors"><td className="px-5 py-4"><div className="flex items-center gap-3"><span className="text-2xl">{product.image}</span><div><p className="font-medium text-gray-900 text-sm">{product.name}</p><p className="text-xs text-gray-500">{product.author}</p></div></div></td><td className="px-5 py-4"><span className="text-xs font-medium px-2.5 py-1 rounded-full bg-gray-100 text-gray-700">{categoryLabels[product.category]}</span></td><td className="px-5 py-4 text-sm font-medium text-gray-900">${product.price.toFixed(2)}</td><td className="px-5 py-4">{isDigital ? <span className="text-sm font-medium text-purple-600">Digital</span> : <span className={`text-sm font-medium ${product.stock <= 5 ? 'text-red-600' : 'text-gray-900'}`}>{product.stock}</span>}</td><td className="px-5 py-4 text-right"><div className="flex items-center justify-end gap-2"><button onClick={() => openEditForm(product)} className="p-2 rounded-lg hover:bg-amber-100 text-gray-400 hover:text-amber-600 transition-colors"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg></button>{deleteConfirm === product.id ? <div className="flex items-center gap-1"><button onClick={() => handleDelete(product.id)} className="px-2 py-1 text-xs bg-red-500 text-white rounded-lg hover:bg-red-600">Confirm</button><button onClick={() => setDeleteConfirm(null)} className="px-2 py-1 text-xs bg-gray-200 text-gray-600 rounded-lg hover:bg-gray-300">Cancel</button></div> : <button onClick={() => setDeleteConfirm(product.id)} className="p-2 rounded-lg hover:bg-red-100 text-gray-400 hover:text-red-600 transition-colors"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>}</div></td></tr>); })}</tbody>
                                        </table>

                                </div>
                            </div>

                            </div>

                    {showForm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setShowForm(false)} />

                                <div className="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between rounded-t-3xl z-10"><h2 className="text-lg font-bold text-gray-900">{editingProduct ? 'Edit Product' : 'Add New Product'}</h2><button onClick={() => setShowForm(false)} className="p-2 rounded-lg hover:bg-gray-100 transition-colors"><svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button></div>
                                <form onSubmit={handleSubmit} className="p-6 space-y-4">
                                    <div><label className="block text-sm font-medium text-gray-700 mb-2">Product Type</label><div className="grid grid-cols-2 gap-2">{categoryOptions.map(cat => <button key={cat.value} type="button" onClick={() => setFormData({ ...formData, category: cat.value, image: cat.icon })} className={`flex items-center gap-2 p-3 rounded-xl text-sm font-medium border transition-all ${formData.category === cat.value ? 'border-amber-300 bg-amber-50 text-amber-700' : 'border-gray-200 text-gray-500 hover:border-gray-300'}`}><span className="text-lg">{cat.icon}</span><span className="truncate">{categoryLabels[cat.value].split(' ').slice(1).join(' ')}</span></button>)}</div></div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Product Name</label><input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none text-sm" placeholder="Enter product name" /></div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Author / Brand</label><input type="text" required value={formData.author} onChange={e => setFormData({ ...formData, author: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none text-sm" placeholder="Author or brand name" /></div>
                                    <div className="grid grid-cols-2 gap-4"><div><label className="block text-sm font-medium text-gray-700 mb-1">Price ($)</label><input type="number" step="0.01" min="0" required value={formData.price} onChange={e => setFormData({ ...formData, price: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none text-sm" placeholder="0.00" /></div><div><label className="block text-sm font-medium text-gray-700 mb-1">{isDigital ? 'Availability' : 'Stock'}</label>{isDigital ? <div className="px-4 py-2.5 rounded-xl bg-purple-50 border border-purple-200 text-sm text-purple-700">Unlimited (Digital)</div> : <input type="number" min="0" required value={formData.stock} onChange={e => setFormData({ ...formData, stock: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none text-sm" placeholder="0" />}</div></div>
                                    {isDigital && <div><label className="block text-sm font-medium text-gray-700 mb-1">Format</label><input type="text" value={formData.format} onChange={e => setFormData({ ...formData, format: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none text-sm" placeholder={formData.category === 'ebooks' ? 'PDF, EPUB, MOBI' : 'MP3, Stream, WAV'} /></div>}
                                    {formData.category === 'physical-books' && <div><label className="block text-sm font-medium text-gray-700 mb-1">ISBN</label><input type="text" value={formData.isbn} onChange={e => setFormData({ ...formData, isbn: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none text-sm" placeholder="978-0-000-00000-0" /></div>}
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Product Icon</label><div className="flex flex-wrap gap-2">{['📘', '📗', '📙', '📕', '📓', '📔', '📒', '📝', '🖊️', '🖍️', '🗂️', '✏️', '📎', '📐', '🎨', '🎧', '📱', '📰'].map(emoji => <button key={emoji} type="button" onClick={() => setFormData({ ...formData, image: emoji })} className={`w-10 h-10 rounded-xl text-xl flex items-center justify-center border transition-all ${formData.image === emoji ? 'border-amber-300 bg-amber-50 scale-110' : 'border-gray-200 hover:border-gray-300'}`}>{emoji}</button>)}</div></div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Description</label><textarea required value={formData.description} onChange={e => setFormData({ ...formData, description: e.target.value })} rows={3} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100 outline-none text-sm resize-none" placeholder="Brief product description" /></div>
                                    <div className="flex gap-3 pt-2"><button type="button" onClick={() => setShowForm(false)} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-gray-50 transition-colors text-sm">Cancel</button><button type="submit" className="flex-1 py-2.5 rounded-xl bg-amber-600 text-white font-medium hover:bg-amber-700 transition-all flex items-center justify-center gap-2 text-sm"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>{editingProduct ? 'Update' : 'Add Product'}</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function PublisherDashboard() {
            const { products, orders, addProduct, updateProduct, deleteProduct, getProductsByPublisher } = useStore();
            const { user, isPublisher } = useAuth();
            const [activeTab, setActiveTab] = useState('overview');
            const [showForm, setShowForm] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [formData, setFormData] = useState({ name: '', author: '', price: '', category: 'physical-books', image: '📘', stock: '', description: '', format: '', isbn: '' });

            const myProducts = user ? getProductsByPublisher(user.id) : [];
            const myProductIds = new Set(myProducts.map(p => p.id));
            const myOrders = orders.filter(o => o.items.some(item => myProductIds.has(item.product.id)));
            const myRevenue = myOrders.reduce((sum, order) => sum + order.items.filter(item => myProductIds.has(item.product.id)).reduce((s, item) => s + item.product.price * item.quantity, 0), 0);
            const myTotalStock = myProducts.filter(p => !['ebooks', 'audiobooks'].includes(p.category)).reduce((s, p) => s + p.stock, 0);
            const lowStockProducts = myProducts.filter(p => p.stock <= 5 && !['ebooks', 'audiobooks'].includes(p.category));

            const openAddForm = () => { setEditingProduct(null); setFormData({ name: '', author: user?.publisherName || '', price: '', category: 'physical-books', image: '📘', stock: '', description: '', format: '', isbn: '' }); setShowForm(true); };
            const openEditForm = (product) => { setEditingProduct(product); setFormData({ name: product.name, author: product.author, price: product.price.toString(), category: product.category, image: product.image, stock: product.stock.toString(), description: product.description, format: product.format || '', isbn: product.isbn || '' }); setShowForm(true); };

            const handleSubmit = (e) => {
                e.preventDefault();
                const isDigital = ['ebooks', 'audiobooks'].includes(formData.category);
                const productData = { name: formData.name, author: formData.author, price: parseFloat(formData.price) || 0, category: formData.category, image: formData.image, stock: isDigital ? 999 : (parseInt(formData.stock) || 0), description: formData.description, publisherId: user?.id, format: isDigital ? formData.format : undefined, isbn: formData.category === 'physical-books' ? formData.isbn : undefined };
                if (editingProduct) updateProduct({ ...productData, id: editingProduct.id });
                else addProduct(productData);
                setShowForm(false);
                setEditingProduct(null);
            };

            const handleDelete = (id) => { deleteProduct(id); setDeleteConfirm(null); };

            const filteredProducts = myProducts.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.author.toLowerCase().includes(searchTerm.toLowerCase()));

            const categoryOptions = [{ value: 'physical-books', icon: '📘' }, { value: 'ebooks', icon: '📱' }, { value: 'audiobooks', icon: '🎧' }, { value: 'magazines', icon: '📰' }, { value: 'stationery', icon: '✏️' }, { value: 'art-supplies', icon: '🎨' }, { value: 'office-supplies', icon: '📎' }];
            const isDigital = ['ebooks', 'audiobooks'].includes(formData.category);

            if (!isPublisher) return <div className="min-h-screen flex items-center justify-center bg-gray-50/50"><div className="text-center p-8"><svg className="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg><h2 className="text-xl font-bold text-gray-900 mb-2">Publisher Access Required</h2><p className="text-gray-500">You need a publisher account to access this dashboard.</p></div></div>;

            return (
                <div className="min-h-screen bg-gray-50/50">
                    <div className="bg-white border-b border-gray-100">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                <div><div className="flex items-center gap-2 mb-1"><h1 className="text-2xl font-bold text-gray-900">Publisher Dashboard</h1><span className="bg-purple-100 text-purple-700 text-xs font-semibold px-2 py-0.5 rounded-full">Publisher</span></div><p className="text-sm text-gray-500">Welcome back, <span className="font-medium text-gray-700">{user?.publisherName || user?.name}</span></p></div>
                                <button onClick={openAddForm} className="inline-flex items-center gap-2 bg-purple-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-purple-700 transition-all hover:shadow-md active:scale-95"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>Add Product</button>
                            </div>
                            <div className="flex gap-1 mt-6 bg-gray-100 rounded-xl p-1 w-fit">
                                {[{ id: 'overview', label: 'Overview', icon: '📊' }, { id: 'my-products', label: 'My Products', icon: '📦' }, { id: 'sales', label: 'Sales', icon: '💰' }].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === tab.id ? 'bg-white text-purple-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}><span>{tab.icon}</span>{tab.label}</button>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'overview' && (
                            <div className="space-y-8">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-white rounded-2xl border border-gray-100 p-5"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center"><span className="text-xl">💰</span></div><div><p className="text-sm text-gray-500">My Revenue</p><p className="text-xl font-bold text-gray-900">${myRevenue.toFixed(2)}</p></div></div></div>
                                    <div className="bg-white rounded-2xl border border-gray-100 p-5"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center"><span className="text-xl">📦</span></div><div><p className="text-sm text-gray-500">My Products</p><p className="text-xl font-bold text-gray-900">{myProducts.length}</p></div></div></div>
                                    <div className="bg-white rounded-2xl border border-gray-100 p-5"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center"><span className="text-xl">📊</span></div><div><p className="text-sm text-gray-500">Total Stock</p><p className="text-xl font-bold text-gray-900">{myTotalStock}</p></div></div></div>
                                    <div className="bg-white rounded-2xl border border-gray-100 p-5"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center"><span className="text-xl">🛒</span></div><div><p className="text-sm text-gray-500">Orders</p><p className="text-xl font-bold text-gray-900">{myOrders.length}</p></div></div></div>
                                </div>
                                {lowStockProducts.length > 0 && (
                                    <div className="bg-red-50 border border-red-100 rounded-2xl p-5">
                                        <div className="flex items-center gap-2 mb-3"><span className="text-xl">⚠️</span><h3 className="font-semibold text-red-800">Low Stock Alert</h3></div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">{lowStockProducts.map(product => <div key={product.id} className="flex items-center gap-3 bg-white rounded-xl p-3 border border-red-100"><span className="text-2xl">{product.image}</span><div className="flex-1 min-w-0"><p className="text-sm font-medium text-gray-900 truncate">{product.name}</p><p className="text-xs text-red-600 font-medium">{product.stock} left in stock</p></div></div>)}</div>
                                    </div>
                                )}
                                <div className="bg-white rounded-2xl border border-gray-100 p-6">
                                    <h3 className="font-semibold text-gray-900 text-lg mb-4">Recent Sales</h3>
                                    {myOrders.length === 0 ? <p className="text-gray-400 text-sm text-center py-8">No sales yet. Products you list will appear here when sold.</p> : <div className="space-y-3">{myOrders.slice(0, 5).map(order => { const myItems = order.items.filter(item => myProductIds.has(item.product.id)); const myTotal = myItems.reduce((s, item) => s + item.product.price * item.quantity, 0); return <div key={order.id} className="flex items-center justify-between p-3 rounded-xl bg-gray-50"><div><p className="font-medium text-gray-900 text-sm">{order.customerName}</p><p className="text-xs text-gray-500">{myItems.length} of your item{myItems.length !== 1 ? 's' : ''} sold • {new Date(order.date).toLocaleDateString()}</p></div><span className="font-semibold text-purple-600">${myTotal.toFixed(2)}</span></div>; })}</div>}
                                </div>
                            </div>
                        )}
                        {activeTab === 'my-products' && (
                            <div className="space-y-6">
                                <div className="relative max-w-md"><svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg><input type="text" placeholder="Search your products..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-purple-300 focus:ring-2 focus:ring-purple-100 outline-none text-sm bg-white" /></div>
                                <div className="bg-white rounded-2xl border border-gray-100 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full">
                                            <thead><tr className="border-b border-gray-100 bg-gray-50/50"><th className="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Product</th><th className="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Category</th><th className="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Price</th><th className="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Stock</th><th className="text-right px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th></tr></thead>
                                            <tbody>{filteredProducts.map(product => { const isDigital = ['ebooks', 'audiobooks'].includes(product.category); return (<tr key={product.id} className="border-b border-gray-50 hover:bg-purple-50/30 transition-colors"><td className="px-5 py-4"><div className="flex items-center gap-3"><span className="text-2xl">{product.image}</span><div><p className="font-medium text-gray-900 text-sm">{product.name}</p><p className="text-xs text-gray-500">{product.author}</p></div></div></td><td className="px-5 py-4"><span className="text-xs font-medium px-2.5 py-1 rounded-full bg-gray-100 text-gray-700">{categoryLabels[product.category]}</span></td><td className="px-5 py-4 text-sm font-medium text-gray-900">${product.price.toFixed(2)}</td><td className="px-5 py-4">{isDigital ? <span className="text-sm font-medium text-purple-600">Digital</span> : <span className={`text-sm font-medium ${product.stock <= 5 ? 'text-red-600' : 'text-gray-900'}`}>{product.stock}</span>}</td><td className="px-5 py-4 text-right"><div className="flex items-center justify-end gap-2"><button onClick={() => openEditForm(product)} className="p-2 rounded-lg hover:bg-purple-100 text-gray-400 hover:text-purple-600 transition-colors"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg></button>{deleteConfirm === product.id ? <div className="flex items-center gap-1"><button onClick={() => handleDelete(product.id)} className="px-2 py-1 text-xs bg-red-500 text-white rounded-lg hover:bg-red-600">Confirm</button><button onClick={() => setDeleteConfirm(null)} className="px-2 py-1 text-xs bg-gray-200 text-gray-600 rounded-lg hover:bg-gray-300">Cancel</button></div> : <button onClick={() => setDeleteConfirm(product.id)} className="p-2 rounded-lg hover:bg-red-100 text-gray-400 hover:text-red-600 transition-colors"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>}</div></td></tr>); })}</tbody>
                                        </table>
                                    </div>
                                    {filteredProducts.length === 0 && <div className="text-center py-12 text-gray-400"><svg className="w-12 h-12 mx-auto mb-3 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg><p>No products yet. Click "Add Product" to get started.</p></div>}
                                </div>
                            </div>
                        )}
                        {activeTab === 'sales' && (
                            <div className="space-y-4">
                                {myOrders.length === 0 ? <div className="bg-white rounded-2xl border border-gray-100 p-12 text-center"><div className="text-5xl mb-4">📊</div><h3 className="text-lg font-medium text-gray-900 mb-2">No sales yet</h3><p className="text-gray-500 text-sm">Your sales data will appear here once customers purchase your products.</p></div> : myOrders.map(order => { const myItems = order.items.filter(item => myProductIds.has(item.product.id)); const myTotal = myItems.reduce((s, item) => s + item.product.price * item.quantity, 0); return <div key={order.id} className="bg-white rounded-2xl border border-gray-100 p-5"><div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4"><div><h3 className="font-semibold text-gray-900">{order.customerName}</h3><p className="text-sm text-gray-500">{order.customerEmail}</p></div><div className="text-right"><p className="font-bold text-lg text-purple-600">${myTotal.toFixed(2)}</p><p className="text-xs text-gray-400">{new Date(order.date).toLocaleString()}</p></div></div><div className="flex flex-wrap gap-2">{myItems.map(item => <div key={item.product.id} className="flex items-center gap-2 bg-purple-50 rounded-lg px-3 py-2"><span className="text-lg">{item.product.image}</span><span className="text-sm text-gray-700">{item.product.name}</span><span className="text-xs text-gray-400">×{item.quantity}</span></div>)}</div></div>; })}
                            </div>
                        )}
                    </div>
                    {showForm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setShowForm(false)} />
                            <div className="relative bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
                                <div className="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between rounded-t-3xl z-10"><h2 className="text-lg font-bold text-gray-900">{editingProduct ? 'Edit Product' : 'Add New Product'}</h2><button onClick={() => setShowForm(false)} className="p-2 rounded-lg hover:bg-gray-100 transition-colors"><svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button></div>
                                <form onSubmit={handleSubmit} className="p-6 space-y-4">
                                    <div><label className="block text-sm font-medium text-gray-700 mb-2">Product Type</label><div className="grid grid-cols-2 gap-2">{categoryOptions.map(cat => <button key={cat.value} type="button" onClick={() => setFormData({ ...formData, category: cat.value, image: cat.icon })} className={`flex items-center gap-2 p-3 rounded-xl text-sm font-medium border transition-all ${formData.category === cat.value ? 'border-purple-300 bg-purple-50 text-purple-700' : 'border-gray-200 text-gray-500 hover:border-gray-300'}`}><span className="text-lg">{cat.icon}</span><span className="truncate">{categoryLabels[cat.value].split(' ').slice(1).join(' ')}</span></button>)}</div></div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Product Name</label><input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-purple-300 focus:ring-2 focus:ring-purple-100 outline-none text-sm" placeholder="Enter product name" /></div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Author / Brand</label><input type="text" required value={formData.author} onChange={e => setFormData({ ...formData, author: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-purple-300 focus:ring-2 focus:ring-purple-100 outline-none text-sm" placeholder="Author or brand name" /></div>
                                    <div className="grid grid-cols-2 gap-4"><div><label className="block text-sm font-medium text-gray-700 mb-1">Price ($)</label><input type="number" step="0.01" min="0" required value={formData.price} onChange={e => setFormData({ ...formData, price: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-purple-300 focus:ring-2 focus:ring-purple-100 outline-none text-sm" placeholder="0.00" /></div><div><label className="block text-sm font-medium text-gray-700 mb-1">{isDigital ? 'Availability' : 'Stock'}</label>{isDigital ? <div className="px-4 py-2.5 rounded-xl bg-purple-50 border border-purple-200 text-sm text-purple-700">Unlimited (Digital)</div> : <input type="number" min="0" required value={formData.stock} onChange={e => setFormData({ ...formData, stock: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-purple-300 focus:ring-2 focus:ring-purple-100 outline-none text-sm" placeholder="0" />}</div></div>
                                    {isDigital && <div><label className="block text-sm font-medium text-gray-700 mb-1">Format</label><input type="text" value={formData.format} onChange={e => setFormData({ ...formData, format: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-purple-300 focus:ring-2 focus:ring-purple-100 outline-none text-sm" placeholder={formData.category === 'ebooks' ? 'PDF, EPUB, MOBI' : 'MP3, Stream, WAV'} /></div>}
                                    {formData.category === 'physical-books' && <div><label className="block text-sm font-medium text-gray-700 mb-1">ISBN</label><input type="text" value={formData.isbn} onChange={e => setFormData({ ...formData, isbn: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-purple-300 focus:ring-2 focus:ring-purple-100 outline-none text-sm" placeholder="978-0-000-00000-0" /></div>}
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Product Icon</label><div className="flex flex-wrap gap-2">{['📘', '📗', '📙', '📕', '📓', '📔', '📒', '📝', '🖊️', '🖍️', '🗂️', '✏️', '📎', '📐', '🎨', '🎧', '📱', '📰'].map(emoji => <button key={emoji} type="button" onClick={() => setFormData({ ...formData, image: emoji })} className={`w-10 h-10 rounded-xl text-xl flex items-center justify-center border transition-all ${formData.image === emoji ? 'border-purple-300 bg-purple-50 scale-110' : 'border-gray-200 hover:border-gray-300'}`}>{emoji}</button>)}</div></div>
                                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Description</label><textarea required value={formData.description} onChange={e => setFormData({ ...formData, description: e.target.value })} rows={3} className="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-purple-300 focus:ring-2 focus:ring-purple-100 outline-none text-sm resize-none" placeholder="Brief product description" /></div>
                                    <div className="flex gap-3 pt-2"><button type="button" onClick={() => setShowForm(false)} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-gray-50 transition-colors text-sm">Cancel</button><button type="submit" className="flex-1 py-2.5 rounded-xl bg-purple-600 text-white font-medium hover:bg-purple-700 transition-all flex items-center justify-center gap-2 text-sm"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>{editingProduct ? 'Update' : 'Add Product'}</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==================== APP ====================
        function ProtectedRoute({ children, requiredRole }) {
            const { isAuthenticated, user } = useAuth();
            if (!isAuthenticated) return <Navigate to="/login" replace />;
            if (requiredRole && user?.role !== requiredRole) return <Navigate to="/" replace />;
            return children;
        }

        function AppRoutes() {
            return (
                <Routes>
                    <Route path="/" element={<Home />} />
                    <Route path="/shop" element={<Shop />} />
                    <Route path="/cart" element={<Cart />} />
                    <Route path="/login" element={<Login />} />
                    <Route path="/admin" element={<ProtectedRoute requiredRole="admin"><Admin /></ProtectedRoute>} />
                    <Route path="/publisher" element={<ProtectedRoute requiredRole="publisher"><PublisherDashboard /></ProtectedRoute>} />
                    <Route path="*" element={<Navigate to="/" replace />} />
                </Routes>
            );
        }

        function App() {
            return (
                <AuthProvider>
                    <StoreProvider>
                        <BrowserRouter>
                            <div className="min-h-screen bg-gray-50 font-sans antialiased">
                                <Navbar />
                                <AppRoutes />
                                <WhatsAppButton />
                            </div>
                        </BrowserRouter>
                    </StoreProvider>
                </AuthProvider>
            );
        }

        // ==================== RENDER ====================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
